<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BATLLOG 112 - Scanner SALIDA</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: 'Segoe UI', Arial, sans-serif; 
      background: linear-gradient(135deg, #1a472a 0%, #2d5f40 50%, #0d2818 100%);
      padding: 15px;
      min-height: 100vh;
    }
    .container { max-width: 700px; margin: 0 auto; }
    .header {
      background: linear-gradient(135deg, #dc3545 0%, #c82333 100%);
      padding: 20px;
      text-align: center;
      border-radius: 8px;
      border-bottom: 3px solid #d4af37;
      margin-bottom: 20px;
    }
    h1 { color: #d4af37; font-size: 24px; }
    .config-section {
      background: #e8f3ee;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      border-left: 4px solid #dc3545;
    }
    .form-group {
      margin-bottom: 10px;
    }
    .form-group label {
      display: block;
      color: #1a472a;
      font-weight: 600;
      margin-bottom: 5px;
      font-size: 12px;
    }
    .form-group input, .form-group textarea, .form-group select {
      width: 100%;
      padding: 10px;
      border: 1px solid #a8d5ba;
      border-radius: 6px;
      font-size: 13px;
    }
    .form-group textarea {
      resize: vertical;
      min-height: 60px;
    }
    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 15px;
      flex-wrap: wrap;
    }
    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      font-size: 13px;
      min-width: 120px;
    }
    .btn-primary {
      background: linear-gradient(135deg, #dc3545 0%, #c82333 100%);
      color: white;
      text-transform: uppercase;
    }
    .btn-secondary {
      background: linear-gradient(135deg, #6c757d 0%, #545b62 100%);
      color: white;
    }
    .btn-stop {
      background: linear-gradient(135deg, #dc3545 0%, #c82333 100%);
      color: white;
    }
    .status {
      text-align: center;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
      font-weight: 600;
      font-size: 13px;
      background: #cfe2ff;
      color: #084298;
      border-left: 4px solid #084298;
    }
    .status.error {
      background: #f8d7da;
      color: #721c24;
      border-left-color: #721c24;
    }
    .status.success {
      background: #d4edda;
      color: #155724;
      border-left-color: #155724;
    }
    #videoContainer {
      position: relative;
      width: 100%;
      margin: 20px 0;
      border-radius: 8px;
      overflow: hidden;
      display: none;
      background: #000;
    }
    #video {
      width: 100%;
      height: auto;
    }
    .qr-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 280px;
      height: 280px;
      border: 3px solid #dc3545;
      border-radius: 12px;
      pointer-events: none;
      z-index: 10;
      box-shadow: 0 0 30px rgba(40, 167, 69, 0.5);
    }
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .modal.active { display: flex; }
    .modal-content {
      background: white;
      padding: 40px;
      border-radius: 12px;
      text-align: center;
      max-width: 500px;
      border-top: 5px solid #dc3545;
    }
    .soldier-data {
      background: #f5f5f5;
      padding: 15px;
      border-radius: 8px;
      text-align: left;
      margin: 15px 0;
    }
    .soldier-data div {
      margin: 8px 0;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid #ddd;
      padding-bottom: 8px;
    }
    .footer {
      text-align: center;
      color: #a8d5ba;
      padding: 15px;
      margin-top: 20px;
      font-size: 11px;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>📤 BATLLOG 112 - Scanner SALIDA</h1>
  </div>

  <div class="config-section">
    <div class="form-group">
      <label>🔗 URL de Google Apps Script</label>
      <input type="text" id="urlInput" placeholder="https://script.google.com/macros/s/...">
    </div>
    <div class="button-group">
      <button class="btn-primary" onclick="guardarUrl()">💾 Guardar URL</button>
      <button class="btn-secondary" onclick="window.location.href='index.html'">🏠 Volver</button>
    </div>
  </div>

  <div id="status" class="status">⏳ Ingresa la URL y guarda</div>

  <div id="videoContainer">
    <video id="video" playsinline autoplay muted></video>
    <div class="qr-overlay"></div>
  </div>

  <div class="button-group" id="controlButtons" style="display: none; margin: 15px 0;">
    <button class="btn-primary" id="btnStart" onclick="iniciarScanner()">📹 Iniciar Scanner</button>
    <button class="btn-primary btn-stop" id="btnStop" style="display: none;" onclick="detenerScanner()">⏹ Detener</button>
  </div>

  <div id="formularioSeccion" style="display: none;">
    <div class="config-section">
      <div class="form-group">
        <label>📝 Observación</label>
        <textarea id="observacion" placeholder="Ej: Rayón en mira, munición incompleta..."></textarea>
      </div>
      <div class="form-group">
        <label>✓ Estado</label>
        <select id="estado">
          <option value="Correcto">Correcto</option>
          <option value="Incorrecto">Incorrecto</option>
        </select>
      </div>
      <div class="button-group">
        <button class="btn-primary" onclick="guardarRegistro()">✓ Guardar SALIDA</button>
        <button class="btn-secondary" onclick="resetFormulario()">↻ Otro</button>
      </div>
    </div>
  </div>

  <div class="footer">
    <p>BATLLOG 112 © 2026 | Perú - SALIDA</p>
  </div>
</div>

<!-- Modal -->
<div class="modal" id="modal">
  <div class="modal-content">
    <h2>✅ ESCANEO DETECTADO</h2>
    <div class="soldier-data" id="modalData"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
  let appUrl = localStorage.getItem('appUrl') || '';
  let scanning = false;
  let canScan = true;
  let videoStream = null;
  let animationId = null;
  let soldadoActual = null;
  const tipo = 'SALIDA';

  if (appUrl) {
    document.getElementById('urlInput').value = appUrl;
    actualizarEstado();
  }

  function guardarUrl() {
    appUrl = document.getElementById('urlInput').value.trim();
    if (!appUrl) {
      mostrarError('❌ Ingresa la URL');
      return;
    }
    localStorage.setItem('appUrl', appUrl);
    actualizarEstado();
  }

  function actualizarEstado() {
    const status = document.getElementById('status');
    const controlButtons = document.getElementById('controlButtons');
    if (appUrl) {
      status.textContent = '✓ URL configurada - SALIDA';
      controlButtons.style.display = 'flex';
    } else {
      status.textContent = '⏳ Ingresa la URL y guarda';
      controlButtons.style.display = 'none';
    }
  }

  function iniciarScanner() {
    if (!appUrl) {
      mostrarError('❌ Configura la URL primero');
      return;
    }

    const video = document.getElementById('video');
    const videoContainer = document.getElementById('videoContainer');
    videoContainer.style.display = 'block';
    document.getElementById('btnStart').style.display = 'none';
    document.getElementById('btnStop').style.display = 'block';

    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
      .then(stream => {
        videoStream = stream;
        video.srcObject = stream;
        video.onloadedmetadata = () => {
          scanning = true;
          canScan = true;
          escanear(video);
        };
      })
      .catch(err => {
        mostrarError('❌ Error cámara: ' + err.message);
        videoContainer.style.display = 'none';
        document.getElementById('btnStart').style.display = 'block';
        document.getElementById('btnStop').style.display = 'none';
      });
  }

  function escanear(video) {
    if (!scanning) return;

    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    if (canvas.width > 0) {
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      try {
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(imageData.data, canvas.width, canvas.height);

        if (code && canScan) {
          canScan = false;
          soldadoActual = code.data.trim().replace(/\s/g, "");
          detenerScanner();
          mostrarFormulario();
          return;
        }
      } catch(e) {}
    }

    animationId = requestAnimationFrame(() => escanear(video));
  }

  function detenerScanner() {
    scanning = false;
    if (animationId) cancelAnimationFrame(animationId);
    if (videoStream) videoStream.getTracks().forEach(t => t.stop());
    
    document.getElementById('videoContainer').style.display = 'none';
    document.getElementById('btnStart').style.display = 'block';
    document.getElementById('btnStop').style.display = 'none';
  }

  function mostrarFormulario() {
    document.getElementById('formularioSeccion').style.display = 'block';
    document.getElementById('status').textContent = '📝 Completa observación y estado';
  }

  function guardarRegistro() {
    const observacion = document.getElementById('observacion').value.trim();
    const estado = document.getElementById('estado').value;

    const data = {
      qrData: soldadoActual,
      tipo: tipo,
      observacion: observacion,
      estado: estado
    };

    fetch(appUrl, {
      method: 'POST',
      body: JSON.stringify(data)
    })
    .then(r => r.json())
    .then(resultado => {
      if (resultado.success) {
        document.getElementById('status').className = 'status success';
        document.getElementById('status').textContent = '✅ GUARDADO EN SALIDA';
        setTimeout(resetFormulario, 2000);
      } else {
        mostrarError('❌ ' + resultado.error);
      }
    })
    .catch(e => mostrarError('❌ Error: ' + e.message));
  }

  function resetFormulario() {
    document.getElementById('observacion').value = '';
    document.getElementById('estado').value = 'Correcto';
    document.getElementById('formularioSeccion').style.display = 'none';
    document.getElementById('status').textContent = '✓ Listo para otro escaneo';
    soldadoActual = null;
    canScan = true;
  }

  function mostrarError(mensaje) {
    const status = document.getElementById('status');
    status.className = 'status error';
    status.textContent = mensaje;
  }
</script>

</body>
</html>
