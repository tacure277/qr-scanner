<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escáner QR</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #000; color: white; padding: 10px; }
    .container { max-width: 100%; }
    h1 { text-align: center; margin: 20px 0; font-size: 24px; }
    .config { background: #222; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
    .config input { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #444; border-radius: 6px; background: #333; color: white; font-size: 14px; }
    .config button { width: 100%; padding: 12px; background: #4CAF50; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    #reader { width: 100%; height: 400px; border: 2px solid #4CAF50; border-radius: 8px; margin: 15px 0; background: #000; }
    .controls { display: flex; gap: 10px; margin: 15px 0; }
    .controls button { flex: 1; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .btn-start { background: #4CAF50; color: white; }
    .btn-stop { background: #f44336; color: white; display: none; }
    .status { background: #0d5f0d; color: #4CAF50; padding: 15px; border-radius: 6px; text-align: center; font-weight: bold; margin: 15px 0; }
    .status.error { background: #5f0d0d; color: #ff6b6b; }
    .result { background: #222; padding: 12px; margin: 8px 0; border-radius: 6px; border-left: 4px solid #4CAF50; display: flex; justify-content: space-between; }
    .result-id { color: #4CAF50; font-weight: bold; }
    .result-time { color: #aaa; font-size: 12px; }
    .results { max-height: 250px; overflow-y: auto; }
    .empty { text-align: center; color: #666; padding: 20px; }
  </style>
</head>
<body>

<div class="container">
  <h1>📱 Escáner QR</h1>
  
  <div class="config">
    <input type="text" id="urlInput" placeholder="Pega la URL del Apps Script">
    <button onclick="guardarUrl()">✓ Guardar URL</button>
  </div>

  <div class="status" id="status">Configurando...</div>

  <div class="controls">
    <button class="btn-start" id="btnStart" onclick="iniciar()">▶ Iniciar</button>
    <button class="btn-stop" id="btnStop" onclick="detener()">⏹ Detener</button>
  </div>

  <div id="reader"></div>

  <div class="results" id="resultsList">
    <div class="empty">Sin escaneos aún</div>
  </div>
  
  <div style="text-align: center; margin-top: 20px;">
    <button onclick="limpiarResultados()" style="padding: 10px 20px; background: #f44336; color: white; border: none; border-radius: 6px; cursor: pointer;">Limpiar</button>
  </div>
</div>

<script src="https://unpkg.com/html5-qrcode"></script>
<script>
  let appUrl = localStorage.getItem('appUrl') || '';
  let qrScanner = null;
  let scans = [];

  if (appUrl) {
    document.getElementById('urlInput').value = appUrl;
    document.getElementById('status').textContent = '✓ URL configurada - Click en Iniciar';
    document.getElementById('btnStart').style.display = 'block';
  }

  function guardarUrl() {
    appUrl = document.getElementById('urlInput').value.trim();
    if (!appUrl) {
      mostrarError('Ingresa la URL');
      return;
    }
    localStorage.setItem('appUrl', appUrl);
    document.getElementById('status').className = 'status';
    document.getElementById('status').textContent = '✓ URL configurada - Click en Iniciar';
    document.getElementById('btnStart').style.display = 'block';
  }

  function iniciar() {
    if (!appUrl) {
      mostrarError('Primero guarda la URL');
      return;
    }

    document.getElementById('status').className = 'status';
    document.getElementById('status').textContent = '⏳ Iniciando cámara...';

    qrScanner = new Html5Qrcode('reader');

    const config = {
      fps: 10,
      qrbox: { width: 250, height: 250 }
    };

    qrScanner.start(
      { facingMode: 'environment' },
      config,
      onScanSuccess,
      onScanFailure
    ).then(() => {
      document.getElementById('status').className = 'status';
      document.getElementById('status').textContent = '📹 Escaneando...';
      document.getElementById('btnStart').style.display = 'none';
      document.getElementById('btnStop').style.display = 'block';
    }).catch(err => {
      mostrarError('Error: ' + err.message);
    });
  }

  function detener() {
    if (qrScanner) {
      qrScanner.stop();
      document.getElementById('status').className = 'status';
      document.getElementById('status').textContent = '⏹ Detenido';
      document.getElementById('btnStart').style.display = 'block';
      document.getElementById('btnStop').style.display = 'none';
    }
  }

  function onScanSuccess(decodedText) {
    enviarDatos(decodedText);
  }

  function onScanFailure(error) {
    // No mostrar errores, solo continuar escaneando
  }

  async function enviarDatos(data) {
    document.getElementById('status').className = 'status';
    document.getElementById('status').textContent = '📤 Enviando...';

    try {
      const response = await fetch(appUrl, {
        method: 'POST',
        body: JSON.stringify({ nombre: data, id: data, rango: 'Militar' })
      });

      if (response.ok) {
        scans.unshift({ id: data, time: new Date().toLocaleTimeString('es-ES') });
        mostrarResultados();
        document.getElementById('status').className = 'status';
        document.getElementById('status').textContent = '✅ ¡Registrado!';
      } else {
        mostrarError('Error al enviar');
      }
    } catch(e) {
      mostrarError('Error: ' + e.message);
    }

    setTimeout(() => {
      if (document.getElementById('btnStop').style.display !== 'none') {
        document.getElementById('status').className = 'status';
        document.getElementById('status').textContent = '📹 Escaneando...';
      }
    }, 2000);
  }

  function mostrarResultados() {
    const el = document.getElementById('resultsList');
    if (scans.length === 0) {
      el.innerHTML = '<div class="empty">Sin escaneos aún</div>';
      return;
    }

    el.innerHTML = scans.map((s, i) => `
      <div class="result">
        <div>
          <div class="result-id">${s.id}</div>
          <div class="result-time">${s.time}</div>
        </div>
        <button onclick="eliminar(${i})" style="background: #f44336; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer;">✕</button>
      </div>
    `).join('');
  }

  function eliminar(i) {
    scans.splice(i, 1);
    mostrarResultados();
  }

  function limpiarResultados() {
    if (confirm('¿Limpiar todos los escaneos?')) {
      scans = [];
      mostrarResultados();
    }
  }

  function mostrarError(msg) {
    const el = document.getElementById('status');
    el.className = 'status error';
    el.textContent = '❌ ' + msg;
  }
</script>

</body>
</html>
