<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BATLLOG 112 - Sanidad QR</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: 'Segoe UI', 'Roboto', Arial, sans-serif; 
      background: linear-gradient(135deg, #1a472a 0%, #2d5f40 50%, #0d2818 100%);
      padding: 15px;
      min-height: 100vh;
    }
    .container { max-width: 1200px; margin: 0 auto; }
    .header {
      background: linear-gradient(135deg, #2d5f40 0%, #1a472a 100%);
      padding: 15px;
      text-align: center;
      border-radius: 8px;
      border-bottom: 3px solid #d4af37;
      margin-bottom: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    h1 { color: #d4af37; font-size: 24px; margin-bottom: 3px; }
    .subtitle { color: #a8d5ba; font-size: 12px; }
    
    .status {
      text-align: center;
      padding: 6px;
      background: linear-gradient(135deg, #cfe2ff 0%, #b6d4fe 100%);
      color: #084298;
      border-radius: 8px;
      margin-bottom: 15px;
      font-weight: 600;
      border-left: 4px solid #084298;
      font-size: 13px;
    }
    
    .options {
      background: #f5f5f5;
      padding: 6px;
      border-radius: 6px;
      margin-bottom: 12px;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    
    .options label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      font-weight: 500;
      color: #1a472a;
      font-size: 13px;
    }
    
    .controls {
      display: flex;
      gap: 4px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }
    
    button {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      font-size: 12px;
    }
    
    .btn-generate {
      background: linear-gradient(135deg, #2d5f40 0%, #1a472a 100%);
      color: #d4af37;
      text-transform: uppercase;
    }
    
    .btn-print {
      background: linear-gradient(135deg, #007bff 0%, #0056b3 100%);
      color: white;
      text-transform: uppercase;
      display: none;
    }
    
    .btn-print.show {
      display: inline-block;
    }
    
    .qr-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 15px;
    }
    
    .qr-grid.col5 {
      grid-template-columns: repeat(5, 1fr);
    }
    
    .qr-card {
      background: white;
      border: 1px solid #ddd;
      padding: 4px;
      border-radius: 4px;
      text-align: center;
      page-break-inside: avoid;
    }
    
    .qr-card h3 {
      color: #1a472a;
      font-size: 8px;
      margin-bottom: 2px;
      font-weight: 700;
      text-transform: uppercase;
      word-break: break-word;
      line-height: 1;
      min-height: 18px;
      max-height: 18px;
      overflow: visible;
    }
    
    .qr-card .dni {
      color: #5a7a6d;
      font-size: 6px;
      margin-bottom: 3px;
      font-weight: 600;
    }
    
    .qr-image {
      width: 150px;
      height: 150px;
      margin: 0 auto;
      display: block;
      
      
      overflow: visible;
      border-radius: 2px;
    }
    
    .qr-image canvas {
      width: 100% !important;
      height: 100% !important;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    
    .footer {
      text-align: center;
      color: #a8d5ba;
      padding: 15px;
      margin-top: 30px;
      border-top: 1px solid rgba(212, 175, 55, 0.2);
      font-size: 11px;
    }
    
    @media print {
      body { background: white; }
      .header, .controls, .options, .status, .footer { display: none; }
      .qr-grid { margin-top: 0; }
    }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🎖️ BATLLOG 112 - Sanidad</h1>
    <p class="subtitle">Generador de QR - Compañía Sanidad</p>
  </div>

  <div class="status">✓ 13 soldados de Sanidad precargados</div>
  
  <div class="options">
    <label>
      <input type="radio" name="columnas" value="3" checked onchange="cambiarColumnas(3)">
      3 columnas
    </label>
    <label>
      <input type="radio" name="columnas" value="5" onchange="cambiarColumnas(5)">
      5 columnas
    </label>
  </div>
  
  <div class="controls">
    <button class="btn-generate" onclick="generarSanidad()">🎯 Generar QR</button>
    <button class="btn-print" id="btnPrint" onclick="window.print()">🖨️ Imprimir</button>
    <button class="btn-generate" onclick="window.location.href='scanner-profesional.html?grupo=Sanidad'" style="background: linear-gradient(135deg, #6c757d 0%, #545b62 100%);">📱 Ir a Scanner</button>
    <button class="btn-generate" onclick="window.location.href='index.html'" style="background: linear-gradient(135deg, #17a2b8 0%, #117a8b 100%);">🏠 Volver al Inicio</button>
  </div>

  <div class="qr-grid" id="qrGrid"></div>

  <div class="footer">
    <p>BATLLOG 112 © 2026 | Perú</p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
  const sanidad = [
    { apellido: "HUAMAN FUENTES", dni: "757425877", grado: "SGTO1", armamento: "GALIL", numArm: "97134108" },
    { apellido: "HERRERA SAUCEDO", dni: "76440794", grado: "SGTO2", armamento: "FAL", numArm: "1711788" },
    { apellido: "ISUIZA HUAMAN", dni: "74630366", grado: "CABO", armamento: "FAL", numArm: "1711474" },
    { apellido: "PASQUEL CHUQUIYAURI", dni: "60353322", grado: "CABO", armamento: "FAL", numArm: "1607007" },
    { apellido: "ALVARADO BETETA", dni: "60978240", grado: "CABO", armamento: "FAL", numArm: "1606661" },
    { apellido: "ROJAS LOMAS", dni: "81298002", grado: "CABO", armamento: "FAL", numArm: "1606561" },
    { apellido: "ROJAS LOMAS", dni: "81298001", grado: "CABO", armamento: "FAL", numArm: "1605285" },
    { apellido: "BORJAS CHAVARRIA", dni: "60671409", grado: "SLDO", armamento: "FAL", numArm: "1604844" },
    { apellido: "CALISAYA LONG", dni: "74587643", grado: "SLDO", armamento: "FAL", numArm: "1604710" },
    { apellido: "FERNANDEZ AREVALO", dni: "61265796", grado: "SLDO", armamento: "FAL", numArm: "1604645" },
    { apellido: "TUANAMA QUILICHA", dni: "74395760", grado: "SLDO", armamento: "FAL", numArm: "1594622" },
    { apellido: "YAHUARCANI PAREDES", dni: "61345749", grado: "SLDO", armamento: "FAL", numArm: "1593604" },
    { apellido: "TITO COTIPA", dni: "76779812", grado: "SLDO", armamento: "FAL", numArm: "1593604" }
  ];

  function cambiarColumnas(n) {
    const grid = document.getElementById('qrGrid');
    if (n === 5) {
      grid.classList.add('col5');
    } else {
      grid.classList.remove('col5');
    }
  }

  function generarSanidad() {
    const grid = document.getElementById('qrGrid');
    grid.innerHTML = '';
    
    const ordenado = [...sanidad].sort((a, b) => a.apellido.localeCompare(b.apellido));
    
    ordenado.forEach((s, index) => {
      const qrData = `${s.apellido}|${s.grado}|${s.dni}|${s.armamento}|${s.numArm}`;
      
      const card = document.createElement('div');
      card.className = 'qr-card';
      card.innerHTML = `
        <h3>${s.apellido}</h3>
        <div class="dni">${s.dni}</div>
        <div id="qr-${index}" class="qr-image"></div>
      `;
      grid.appendChild(card);
      
      new QRCode(document.getElementById(`qr-${index}`), {
        text: qrData,
        width: 150,
        height: 150,
        colorDark: "#1a472a",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.L
      });
    });
    
    document.getElementById('btnPrint').classList.add('show');
  }
</script>
</body>
</html>
