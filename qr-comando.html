<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BATLLOG 112 - Comando y Servicio QR</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: 'Segoe UI', 'Roboto', Arial, sans-serif; 
      background: linear-gradient(135deg, #1a472a 0%, #2d5f40 50%, #0d2818 100%);
      padding: 15px;
      min-height: 100vh;
    }
    .container { max-width: 1200px; margin: 0 auto; }
    .header {
      background: linear-gradient(135deg, #2d5f40 0%, #1a472a 100%);
      padding: 15px;
      text-align: center;
      border-radius: 8px;
      border-bottom: 3px solid #d4af37;
      margin-bottom: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    h1 { color: #d4af37; font-size: 24px; margin-bottom: 3px; }
    .subtitle { color: #a8d5ba; font-size: 12px; }
    .status {
      text-align: center;
      padding: 6px;
      background: linear-gradient(135deg, #cfe2ff 0%, #b6d4fe 100%);
      color: #084298;
      border-radius: 8px;
      margin-bottom: 15px;
      font-weight: 600;
      border-left: 4px solid #084298;
      font-size: 13px;
    }
    .options {
      background: #f5f5f5;
      padding: 6px;
      border-radius: 6px;
      margin-bottom: 12px;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    .options label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      font-weight: 500;
      color: #1a472a;
      font-size: 13px;
    }
    .controls {
      display: flex;
      gap: 4px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }
    button {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      font-size: 12px;
    }
    .btn-generate {
      background: linear-gradient(135deg, #2d5f40 0%, #1a472a 100%);
      color: #d4af37;
      text-transform: uppercase;
    }
    .btn-print {
      background: linear-gradient(135deg, #007bff 0%, #0056b3 100%);
      color: white;
      text-transform: uppercase;
      display: none;
    }
    .btn-print.show { display: inline-block; }
    .qr-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 15px;
    }
    .qr-grid.col5 { grid-template-columns: repeat(5, 1fr); }
    .qr-card {
      background: white;
      border: 1px solid #ddd;
      padding: 4px;
      border-radius: 4px;
      text-align: center;
      page-break-inside: avoid;
    }
    .qr-card h3 {
      color: #1a472a;
      font-size: 8px;
      margin-bottom: 2px;
      font-weight: 700;
      text-transform: uppercase;
      word-break: break-word;
      line-height: 1;
      min-height: 18px;
      max-height: 18px;
      overflow: visible;
    }
    .qr-card .dni {
      color: #5a7a6d;
      font-size: 6px;
      margin-bottom: 3px;
      font-weight: 600;
    }
    .qr-image {
      width: 150px;
      height: 150px;
      margin: 0 auto;
      display: block;
      
      
      overflow: visible;
      border-radius: 2px;
    }
    .qr-image canvas {
      width: 100% !important;
      height: 100% !important;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    .footer {
      text-align: center;
      color: #a8d5ba;
      padding: 15px;
      margin-top: 30px;
      border-top: 1px solid rgba(212, 175, 55, 0.2);
      font-size: 11px;
    }
    @media print {
      body { background: white; }
      .header, .controls, .options, .status, .footer { display: none; }
      .qr-grid { margin-top: 0; }
    }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🎖️ BATLLOG 112 - Comando y Servicio</h1>
    <p class="subtitle">Generador de QR - Compañía Comando y Servicio</p>
  </div>
  <div class="status">✓ 24 soldados de Comando y Servicio precargados</div>
  <div class="options">
    <label><input type="radio" name="columnas" value="3" checked onchange="cambiarColumnas(3)">3 columnas</label>
    <label><input type="radio" name="columnas" value="5" onchange="cambiarColumnas(5)">5 columnas</label>
  </div>
  <div class="controls">
    <button class="btn-generate" onclick="generarComando()">🎯 Generar QR</button>
    <button class="btn-print" id="btnPrint" onclick="window.print()">🖨️ Imprimir</button>
    <button class="btn-generate" onclick="window.location.href='scanner-profesional.html?grupo=Comando y Servicio'" style="background: linear-gradient(135deg, #6c757d 0%, #545b62 100%);">📱 Ir a Scanner</button>
    <button class="btn-generate" onclick="window.location.href='index.html'" style="background: linear-gradient(135deg, #17a2b8 0%, #117a8b 100%);">🏠 Volver al Inicio</button>
  </div>
  <div class="qr-grid" id="qrGrid"></div>
  <div class="footer"><p>BATLLOG 112 © 2026 | Perú</p></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
  const comando = [
    { apellido: "MORALES GOMEZ RUBEN GIANCARLO", dni: "40691376", grado: "TTE CRL COM", armamento: "UZI", numArm: "12498" },
    { apellido: "HEREDIA LOPEZ ALFREDO ARTURO", dni: "70369147", grado: "MY COM", armamento: "UZI", numArm: "12499" },
    { apellido: "ESPINOZA PALACIOS YESSENIA DEL ROSARIO", dni: "45515341", grado: "CAP COM", armamento: "UZI", numArm: "12501" },
    { apellido: "SANCHEZ PANTA PEDRO JAIME", dni: "78635540", grado: "SGTO2° SAA", armamento: "FAL", numArm: "31186" },
    { apellido: "ABAD PALACIOS EDGAR ALBERTO", dni: "44614990", grado: "SO1° T/ADM", armamento: "GALIL", numArm: "96114220" },
    { apellido: "CHAVEZ PEÑA JEAN PIERE", dni: "61244179", grado: "SGTO1° REE", armamento: "GALIL", numArm: "96114224" },
    { apellido: "SALAZAR ÑAHUI JUAN ANIBAL", dni: "70538740", grado: "SGTO2° SAA", armamento: "FAL", numArm: "32351" },
    { apellido: "ILUQUIZ MANRIQUE LEONEL DAVID", dni: "61171490", grado: "SLDO SAA", armamento: "FAL", numArm: "33903" },
    { apellido: "VILLANTOY LAULATE CARLOS ALBERTO", dni: "61772703", grado: "SLDO SAA", armamento: "FAL", numArm: "34268" },
    { apellido: "ROCA ROSALES EDUARDO ENRIQUE", dni: "62444290", grado: "SLDO SAA", armamento: "FAL", numArm: "35141" },
    { apellido: "LIÑAN TORRES VICTOR LEONARDO", dni: "72865858", grado: "CABO SAA", armamento: "FAL", numArm: "33345" },
    { apellido: "BARJA HILARIO EDU EDGAR", dni: "72424298", grado: "SGTO2° SAA", armamento: "FAL", numArm: "32957" },
    { apellido: "ANYAIPOMA FERNANDEZ MICHAEL DEREK", dni: "71180716", grado: "CABO SAA", armamento: "FAL", numArm: "33029" },
    { apellido: "QUINDE VELASQUEZ ENRIQUE FRANCISCO", dni: "70707365", grado: "CABO SAA", armamento: "FAL", numArm: "32986" },
    { apellido: "PIRICHICO PUÑIRO HUMBERTO JESUS", dni: "60195460", grado: "SGTO2° SAA", armamento: "FAL", numArm: "32504" },
    { apellido: "QUINTO NAVARRO NEFER ABRAHAM", dni: "60443201", grado: "SLDO SAA", armamento: "FAL", numArm: "33670" },
    { apellido: "BAZAN SALAS WILMER ALEJANDRO", dni: "60089205", grado: "SGTO2° SAA", armamento: "FAL", numArm: "31721" },
    { apellido: "CASTRO BRAVO JOSEMARIA", dni: "74659256", grado: "SLDO SAA", armamento: "FAL", numArm: "36173" },
    { apellido: "QUISPE PAHIUA RICARDO", dni: "09633112", grado: "TCO3° T/INF", armamento: "UZI", numArm: "12504" },
    { apellido: "GALARZA MONTES KLEVER JHANPIER", dni: "92640502", grado: "SGTO2° SAA", armamento: "FAL", numArm: "31352" },
    { apellido: "GARCIA SURITA BRAYAN", dni: "72357945", grado: "SGTO2° SAA", armamento: "FAL", numArm: "32792" },
    { apellido: "HUINCHO SEMINARIO ELEONAY ORNAN", dni: "60234359", grado: "SLDO SAA", armamento: "FAL", numArm: "34810" },
    { apellido: "CASTRO SEGURA VINCEL", dni: "60061570", grado: "SLDO SAA", armamento: "FAL", numArm: "35525" },
    { apellido: "NESTARES TAMARIS JHASTEEN", dni: "71162210", grado: "SLDO SAA", armamento: "FAL", numArm: "36092" }
  ];
  function cambiarColumnas(n) {
    const grid = document.getElementById('qrGrid');
    if (n === 5) grid.classList.add('col5');
    else grid.classList.remove('col5');
  }
  function generarComando() {
    const grid = document.getElementById('qrGrid');
    grid.innerHTML = '';
    const ordenado = [...comando].sort((a, b) => a.apellido.localeCompare(b.apellido));
    ordenado.forEach((s, index) => {
      const qrData = `${s.apellido}|${s.grado}|${s.dni}|${s.armamento}|${s.numArm}`;
      const card = document.createElement('div');
      card.className = 'qr-card';
      card.innerHTML = `<h3>${s.apellido}</h3><div class="dni">${s.dni}</div><div id="qr-${index}" class="qr-image"></div>`;
      grid.appendChild(card);
      new QRCode(document.getElementById(`qr-${index}`), {
        text: qrData,
        width: 150,
        height: 150,
        colorDark: "#1a472a",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.L
      });
    });
    document.getElementById('btnPrint').classList.add('show');
  }
</script>
</body>
</html>
