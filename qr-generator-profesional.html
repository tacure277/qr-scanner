<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BATLLOG 112 - Generador de QR</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: 'Segoe UI', 'Roboto', Arial, sans-serif; 
      background: linear-gradient(135deg, #1a472a 0%, #2d5f40 50%, #0d2818 100%);
      padding: 20px;
      min-height: 100vh;
    }
    .container { max-width: 1200px; margin: 0 auto; }
    .header {
      background: linear-gradient(135deg, #2d5f40 0%, #1a472a 100%);
      padding: 25px;
      text-align: center;
      border-radius: 8px;
      border-bottom: 3px solid #d4af37;
      margin-bottom: 25px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    h1 { color: #d4af37; font-size: 28px; margin-bottom: 5px; font-weight: 700; }
    .subtitle { color: #a8d5ba; font-size: 14px; font-weight: 500; }
    .info-box { 
      background: linear-gradient(135deg, #d4edda 0%, #c3e6cb 100%);
      color: #155724; 
      padding: 18px; 
      border-radius: 8px; 
      margin-bottom: 25px; 
      border-left: 4px solid #28a745;
      font-size: 14px;
      box-shadow: 0 2px 8px rgba(40, 167, 69, 0.1);
    }
    .controls { 
      display: flex; 
      gap: 10px; 
      margin-bottom: 25px;
      flex-wrap: wrap;
    }
    .controls button { 
      padding: 12px 30px; 
      border: none; 
      border-radius: 6px; 
      font-weight: 600; 
      cursor: pointer; 
      font-size: 14px;
      transition: all 0.3s;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }
    .btn-generate { 
      background: linear-gradient(135deg, #2d5f40 0%, #1a472a 100%);
      color: #d4af37; 
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .btn-generate:hover { 
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(45, 95, 64, 0.3);
    }
    .btn-print { 
      background: linear-gradient(135deg, #007bff 0%, #0056b3 100%);
      color: white;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .btn-print:hover { 
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(0, 123, 255, 0.3);
    }
    .qr-grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); 
      gap: 20px; 
      margin-top: 30px;
    }
    .qr-card { 
      background: white; 
      border: 2px solid #2d5f40; 
      padding: 20px; 
      border-radius: 8px; 
      text-align: center;
      page-break-inside: avoid; 
      box-shadow: 0 4px 12px rgba(45, 95, 64, 0.2);
      transition: all 0.3s;
    }
    .qr-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 20px rgba(45, 95, 64, 0.3);
    }
    .qr-card h3 { 
      color: #1a472a; 
      margin-bottom: 12px; 
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .qr-number { 
      background: linear-gradient(135deg, #2d5f40 0%, #1a472a 100%);
      color: #d4af37;
      padding: 8px;
      border-radius: 6px;
      font-weight: bold;
      margin-bottom: 12px;
      font-size: 12px;
    }
    .qr-image { 
      width: 220px; 
      height: 220px; 
      margin: 0 auto 15px; 
      border: 2px solid #d4af37;
      border-radius: 6px;
      background: white;
    }
    .qr-image img { 
      width: 100%; 
      height: 100%; 
    }
    .qr-data { 
      font-size: 10px; 
      color: #1a472a; 
      background: #f5f5f5; 
      padding: 10px; 
      border-radius: 4px; 
      word-break: break-all;
      border-left: 3px solid #d4af37;
      text-align: left;
    }
    .qr-labels { 
      font-size: 12px; 
      color: #2d5f40; 
      margin-top: 12px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      text-align: left;
    }
    .qr-labels div { 
      background: #f5f5f5; 
      padding: 6px;
      border-radius: 4px;
      border-left: 2px solid #d4af37;
    }
    .qr-labels strong { 
      color: #1a472a; 
      display: block;
      font-size: 10px;
      font-weight: 600;
    }
    .status { 
      text-align: center; 
      padding: 15px; 
      background: linear-gradient(135deg, #cfe2ff 0%, #b6d4fe 100%);
      color: #084298; 
      border-radius: 8px; 
      margin-bottom: 20px;
      font-weight: 600;
      border-left: 4px solid #084298;
    }
    .footer { 
      text-align: center; 
      color: #a8d5ba; 
      padding: 20px; 
      margin-top: 40px;
      border-top: 1px solid rgba(212, 175, 55, 0.2);
    }
    @media print {
      body { background: white; }
      .header, .info-box, .controls, .status { display: none; }
      .qr-grid { margin-top: 0; }
      .qr-card { page-break-inside: avoid; }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>🎖️ BATLLOG 112 - Generador de QR</h1>
    <p class="subtitle">Compañía Sanidad - Relación de Personal</p>
  </div>

  <div class="info-box">
    ✓ Se generarán 13 códigos QR listos para imprimir. Formato: NOMBRE|GRADO|DNI|ARMAMENTO|N° ARMAMENTO
  </div>

  <div class="status" id="status"></div>

  <div class="controls">
    <button class="btn-generate" onclick="generarQR()">🎯 Generar QR</button>
    <button class="btn-print" onclick="window.print()" style="display:none;" id="btnPrint">🖨️ Imprimir QR</button>
  </div>

  <div class="qr-grid" id="qrGrid"></div>

  <div class="footer">
    <p>BATLLOG 112 © 2026 | Perú</p>
    <p>Compañía Sanidad</p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
  const soldados = [
    { numero: "01", grado: "SGTO1 REE", nombre: "HUAMAN FUENTES WILMER", dni: "757425877", armamento: "GALIL", numArm: "97134108" },
    { numero: "02", grado: "SGTO2", nombre: "HERRERA SAUCEDO ONEY", dni: "76440794", armamento: "FAL", numArm: "1711788" },
    { numero: "03", grado: "CABO", nombre: "ISUIZA HUAMAN LLIN ERIC", dni: "74630366", armamento: "FAL", numArm: "1711474" },
    { numero: "04", grado: "CABO", nombre: "PASQUEL CHUQUIYAURI JELSIN JAVIER", dni: "60353322", armamento: "FAL", numArm: "1607007" },
    { numero: "05", grado: "CABO", nombre: "ALVARADO BETETA JESUS ORE", dni: "60978240", armamento: "FAL", numArm: "1606661" },
    { numero: "06", grado: "CABO", nombre: "ROJAS LOMAS LARRY ABADIAS", dni: "81298002", armamento: "FAL", numArm: "1606561" },
    { numero: "07", grado: "CABO", nombre: "ROJAS LOMAS JHANS LORENZO", dni: "81298001", armamento: "FAL", numArm: "1605285" },
    { numero: "08", grado: "SLDO", nombre: "BORJAS CHAVARRIA CRISTOPHER", dni: "60671409", armamento: "FAL", numArm: "1604844" },
    { numero: "09", grado: "SLDO", nombre: "CALISAYA LONG KEVIN", dni: "74587643", armamento: "FAL", numArm: "1604710" },
    { numero: "10", grado: "SLDO", nombre: "FERNANDEZ AREVALO STEVEN", dni: "61265796", armamento: "FAL", numArm: "1604645" },
    { numero: "11", grado: "SLDO", nombre: "TUANAMA QUILICHA PERCY", dni: "74395760", armamento: "FAL", numArm: "1594622" },
    { numero: "12", grado: "SLDO", nombre: "YAHUARCANI PAREDES MOISES", dni: "61345749", armamento: "FAL", numArm: "1593604" },
    { numero: "13", grado: "SLDO", nombre: "TITO COTIPA ILLANAMI", dni: "76779812", armamento: "FAL", numArm: "1593604" }
  ];

  function generarQR() {
    const grid = document.getElementById('qrGrid');
    const status = document.getElementById('status');
    
    grid.innerHTML = '';
    status.textContent = 'Generando 13 códigos QR...';

    soldados.forEach((s, index) => {
      setTimeout(() => {
        const qrData = `${s.nombre}|${s.grado}|${s.dni}|${s.armamento}|${s.numArm}`;
        
        const card = document.createElement('div');
        card.className = 'qr-card';
        card.innerHTML = `
          <div class="qr-number">Soldado #${s.numero}</div>
          <h3>${s.nombre.substring(0, 30)}${s.nombre.length > 30 ? '...' : ''}</h3>
          <div id="qr-${index}"></div>
          <div class="qr-labels">
            <div><strong>Grado:</strong> ${s.grado}</div>
            <div><strong>DNI:</strong> ${s.dni}</div>
            <div><strong>Arma:</strong> ${s.armamento}</div>
            <div><strong>N° Arma:</strong> ${s.numArm}</div>
          </div>
          <div class="qr-data">${qrData}</div>
        `;
        grid.appendChild(card);
        
        // Generar QR con QRCode.js
        new QRCode(document.getElementById(`qr-${index}`), {
          text: qrData,
          width: 200,
          height: 200,
          colorDark: "#1a472a",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.H
        });

        if (index === soldados.length - 1) {
          status.textContent = '✅ 13 QR generados correctamente - Listo para imprimir';
          document.getElementById('btnPrint').style.display = 'inline-block';
        }
      }, index * 100);
    });
  }

  window.addEventListener('load', () => {
    document.getElementById('status').textContent = 'Click en "🎯 Generar QR" para crear los códigos';
  });
</script>

</body>
</html>
