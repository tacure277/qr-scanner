<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BATLLOG 112 - Generador QR Avanzado</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: 'Segoe UI', 'Roboto', Arial, sans-serif; 
      background: linear-gradient(135deg, #1a472a 0%, #2d5f40 50%, #0d2818 100%);
      padding: 20px;
      min-height: 100vh;
    }
    .container { max-width: 1200px; margin: 0 auto; }
    .header {
      background: linear-gradient(135deg, #2d5f40 0%, #1a472a 100%);
      padding: 25px;
      text-align: center;
      border-radius: 8px;
      border-bottom: 3px solid #d4af37;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    h1 { color: #d4af37; font-size: 28px; margin-bottom: 5px; }
    .subtitle { color: #a8d5ba; font-size: 14px; }
    
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .tab-btn {
      padding: 12px 25px;
      background: linear-gradient(135deg, #2d5f40 0%, #1a472a 100%);
      color: #d4af37;
      border: 2px solid #d4af37;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s;
    }
    .tab-btn.active {
      background: #d4af37;
      color: #1a472a;
    }
    .tab-btn:hover {
      transform: translateY(-2px);
    }
    
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    
    .form-section {
      background: linear-gradient(135deg, #e8f3ee 0%, #dff0e8 100%);
      padding: 20px;
      border-radius: 8px;
      border-left: 4px solid #2d5f40;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(45, 95, 64, 0.1);
    }
    
    .form-group {
      margin-bottom: 15px;
    }
    
    .form-group label {
      display: block;
      color: #1a472a;
      font-weight: 600;
      margin-bottom: 5px;
      font-size: 13px;
      text-transform: uppercase;
    }
    
    .form-group input {
      width: 100%;
      padding: 10px;
      border: 1px solid #a8d5ba;
      border-radius: 6px;
      font-size: 14px;
      background: white;
    }
    
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }
    
    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    
    button {
      padding: 12px 30px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }
    
    .btn-add {
      background: linear-gradient(135deg, #28a745 0%, #1e7e34 100%);
      color: white;
    }
    
    .btn-generate {
      background: linear-gradient(135deg, #2d5f40 0%, #1a472a 100%);
      color: #d4af37;
      text-transform: uppercase;
    }
    
    .btn-print {
      background: linear-gradient(135deg, #007bff 0%, #0056b3 100%);
      color: white;
      text-transform: uppercase;
      display: none;
    }
    
    .btn-print.show {
      display: inline-block;
    }
    
    .btn-clear {
      background: linear-gradient(135deg, #dc3545 0%, #bd2130 100%);
      color: white;
    }
    
    .options {
      background: #f5f5f5;
      padding: 15px;
      border-radius: 6px;
      margin-bottom: 15px;
      display: flex;
      gap: 15px;
      align-items: center;
      flex-wrap: wrap;
    }
    
    .options label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-weight: 500;
      color: #1a472a;
    }
    
    .options input[type="radio"] {
      cursor: pointer;
    }
    
    .qr-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin-top: 30px;
    }
    
    .qr-grid.col3 {
      grid-template-columns: repeat(3, 1fr);
    }
    
    .qr-card {
      background: white;
      border: 1px solid #ddd;
      padding: 10px;
      border-radius: 6px;
      text-align: center;
      page-break-inside: avoid;
    }
    
    .qr-card h3 {
      color: #1a472a;
      font-size: 12px;
      margin-bottom: 8px;
      font-weight: 700;
      text-transform: uppercase;
      word-break: break-word;
      line-height: 1.2;
      min-height: 24px;
    }
    
    .qr-image {
      width: 128px;
      height: 128px;
      margin: 0 auto 8px;
      background: white;
    }
    
    .qr-image img {
      width: 100%;
      height: 100%;
    }
    
    .status {
      text-align: center;
      padding: 15px;
      background: linear-gradient(135deg, #cfe2ff 0%, #b6d4fe 100%);
      color: #084298;
      border-radius: 8px;
      margin-bottom: 20px;
      font-weight: 600;
      border-left: 4px solid #084298;
    }
    
    .footer {
      text-align: center;
      color: #a8d5ba;
      padding: 20px;
      margin-top: 40px;
      border-top: 1px solid rgba(212, 175, 55, 0.2);
    }
    
    @media print {
      body { background: white; }
      .header, .tabs, .form-section, .controls, .options, .status, .footer { display: none; }
      .qr-grid { margin-top: 0; }
      .qr-card { page-break-inside: avoid; }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>🎖️ BATLLOG 112 - Generador QR Avanzado</h1>
    <p class="subtitle">Compañía Sanidad</p>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="cambiarTab('sanidad')">📋 Sanidad (Precargados)</button>
    <button class="tab-btn" onclick="cambiarTab('manual')">➕ Manual (Rellenar)</button>
  </div>

  <!-- TAB SANIDAD -->
  <div id="sanidad" class="tab-content active">
    <div class="status">✓ 13 soldados precargados de Sanidad</div>
    
    <div class="options">
      <label>
        <input type="radio" name="columnas" value="4" checked onchange="cambiarColumnas(4)">
        4 columnas
      </label>
      <label>
        <input type="radio" name="columnas" value="3" onchange="cambiarColumnas(3)">
        3 columnas
      </label>
    </div>
    
    <div class="controls">
      <button class="btn-generate" onclick="generarSanidad()">🎯 Generar QR</button>
      <button class="btn-print" id="btnPrint" onclick="window.print()">🖨️ Imprimir</button>
      <button class="btn-clear" onclick="limpiarQR()">🗑️ Limpiar</button>
    </div>
  </div>

  <!-- TAB MANUAL -->
  <div id="manual" class="tab-content">
    <div class="form-section">
      <div class="form-row">
        <div class="form-group">
          <label>👤 Apellidos</label>
          <input type="text" id="apellido" placeholder="Ej: HERRERA SAUCEDO">
        </div>
        <div class="form-group">
          <label>⭐ Grado</label>
          <input type="text" id="grado" placeholder="Ej: CABO, SGTO, SLDO">
        </div>
      </div>
      
      <div class="form-row">
        <div class="form-group">
          <label>🆔 DNI</label>
          <input type="text" id="dni" placeholder="Ej: 76440794">
        </div>
        <div class="form-group">
          <label>🔫 Armamento</label>
          <input type="text" id="armamento" placeholder="Ej: FAL, GALIL">
        </div>
      </div>
      
      <div class="form-group">
        <label>🔢 N° Armamento</label>
        <input type="text" id="numArmamento" placeholder="Ej: 1711788">
      </div>
    </div>
    
    <div class="options">
      <label>
        <input type="radio" name="columnasManual" value="4" checked onchange="cambiarColumnasManual(4)">
        4 columnas
      </label>
      <label>
        <input type="radio" name="columnasManual" value="3" onchange="cambiarColumnasManual(3)">
        3 columnas
      </label>
    </div>
    
    <div class="controls">
      <button class="btn-add" onclick="agregarManual()">➕ Agregar</button>
      <button class="btn-generate" onclick="generarManual()">🎯 Generar QR</button>
      <button class="btn-print" id="btnPrintManual" onclick="window.print()">🖨️ Imprimir</button>
      <button class="btn-clear" onclick="limpiarManual()">🗑️ Limpiar</button>
    </div>
  </div>

  <div class="qr-grid" id="qrGrid"></div>

  <div class="footer">
    <p>BATLLOG 112 © 2026 | Perú</p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
  const sanidad = [
    { apellido: "HUAMAN FUENTES", grado: "SGTO1", dni: "757425877", armamento: "GALIL", numArm: "97134108" },
    { apellido: "HERRERA SAUCEDO", grado: "SGTO2", dni: "76440794", armamento: "FAL", numArm: "1711788" },
    { apellido: "ISUIZA HUAMAN", grado: "CABO", dni: "74630366", armamento: "FAL", numArm: "1711474" },
    { apellido: "PASQUEL CHUQUIYAURI", grado: "CABO", dni: "60353322", armamento: "FAL", numArm: "1607007" },
    { apellido: "ALVARADO BETETA", grado: "CABO", dni: "60978240", armamento: "FAL", numArm: "1606661" },
    { apellido: "ROJAS LOMAS", grado: "CABO", dni: "81298002", armamento: "FAL", numArm: "1606561" },
    { apellido: "ROJAS LOMAS", grado: "CABO", dni: "81298001", armamento: "FAL", numArm: "1605285" },
    { apellido: "BORJAS CHAVARRIA", grado: "SLDO", dni: "60671409", armamento: "FAL", numArm: "1604844" },
    { apellido: "CALISAYA LONG", grado: "SLDO", dni: "74587643", armamento: "FAL", numArm: "1604710" },
    { apellido: "FERNANDEZ AREVALO", grado: "SLDO", dni: "61265796", armamento: "FAL", numArm: "1604645" },
    { apellido: "TUANAMA QUILICHA", grado: "SLDO", dni: "74395760", armamento: "FAL", numArm: "1594622" },
    { apellido: "YAHUARCANI PAREDES", grado: "SLDO", dni: "61345749", armamento: "FAL", numArm: "1593604" },
    { apellido: "TITO COTIPA", grado: "SLDO", dni: "76779812", armamento: "FAL", numArm: "1593604" }
  ];

  let registrosManual = [];
  let columnasActuales = 4;
  let columnasManual = 4;

  function cambiarTab(tab) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById(tab).classList.add('active');
    document.querySelector(`[onclick="cambiarTab('${tab}')"]`).classList.add('active');
    document.getElementById('qrGrid').innerHTML = '';
  }

  function cambiarColumnas(n) {
    columnasActuales = n;
    actualizarGrid();
  }

  function cambiarColumnasManual(n) {
    columnasManual = n;
    actualizarGrid();
  }

  function actualizarGrid() {
    const grid = document.getElementById('qrGrid');
    grid.className = `qr-grid ${columnasActuales === 3 ? 'col3' : ''}`;
  }

  function generarSanidad() {
    const grid = document.getElementById('qrGrid');
    grid.innerHTML = '';
    
    // Ordenar por apellido
    const ordenado = [...sanidad].sort((a, b) => a.apellido.localeCompare(b.apellido));
    
    ordenado.forEach((s, index) => {
      const qrData = `${s.apellido}|${s.grado}|${s.dni}|${s.armamento}|${s.numArm}`;
      
      const card = document.createElement('div');
      card.className = 'qr-card';
      card.innerHTML = `
        <h3>${s.apellido}</h3>
        <div id="qr-san-${index}" class="qr-image"></div>
      `;
      grid.appendChild(card);
      
      new QRCode(document.getElementById(`qr-san-${index}`), {
        text: qrData,
        width: 128,
        height: 128,
        colorDark: "#1a472a",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.M
      });
    });
    
    actualizarGrid();
    document.getElementById('btnPrint').classList.add('show');
  }

  function agregarManual() {
    const apellido = document.getElementById('apellido').value.trim();
    const grado = document.getElementById('grado').value.trim();
    const dni = document.getElementById('dni').value.trim();
    const armamento = document.getElementById('armamento').value.trim();
    const numArmamento = document.getElementById('numArmamento').value.trim();
    
    if (!apellido || !grado || !dni || !armamento || !numArmamento) {
      alert('Completa todos los campos');
      return;
    }
    
    registrosManual.push({ apellido, grado, dni, armamento, numArmamento });
    
    document.getElementById('apellido').value = '';
    document.getElementById('grado').value = '';
    document.getElementById('dni').value = '';
    document.getElementById('armamento').value = '';
    document.getElementById('numArmamento').value = '';
    document.getElementById('apellido').focus();
  }

  function generarManual() {
    if (registrosManual.length === 0) {
      alert('Agrega al menos un registro');
      return;
    }
    
    const grid = document.getElementById('qrGrid');
    grid.innerHTML = '';
    
    // Ordenar por apellido
    const ordenado = [...registrosManual].sort((a, b) => a.apellido.localeCompare(b.apellido));
    
    ordenado.forEach((s, index) => {
      const qrData = `${s.apellido}|${s.grado}|${s.dni}|${s.armamento}|${s.numArmamento}`;
      
      const card = document.createElement('div');
      card.className = 'qr-card';
      card.innerHTML = `
        <h3>${s.apellido}</h3>
        <div id="qr-man-${index}" class="qr-image"></div>
      `;
      grid.appendChild(card);
      
      new QRCode(document.getElementById(`qr-man-${index}`), {
        text: qrData,
        width: 128,
        height: 128,
        colorDark: "#1a472a",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.M
      });
    });
    
    actualizarGrid();
    document.getElementById('btnPrintManual').classList.add('show');
  }

  function limpiarQR() {
    document.getElementById('qrGrid').innerHTML = '';
    document.getElementById('btnPrint').classList.remove('show');
  }

  function limpiarManual() {
    registrosManual = [];
    document.getElementById('qrGrid').innerHTML = '';
    document.getElementById('btnPrintManual').classList.remove('show');
  }
</script>

</body>
</html>
