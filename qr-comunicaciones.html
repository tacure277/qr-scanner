<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BATLLOG 112 - Comunicaciones QR</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: 'Segoe UI', 'Roboto', Arial, sans-serif; 
      background: linear-gradient(135deg, #1a472a 0%, #2d5f40 50%, #0d2818 100%);
      padding: 10px;
      min-height: 100vh;
    }
    .container { max-width: 210mm; margin: 0 auto; }
    .header {
      background: linear-gradient(135deg, #2d5f40 0%, #1a472a 100%);
      padding: 12px;
      text-align: center;
      border-radius: 6px;
      border-bottom: 3px solid #d4af37;
      margin-bottom: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    h1 { color: #d4af37; font-size: 20px; margin-bottom: 2px; }
    .subtitle { color: #a8d5ba; font-size: 11px; }
    
    .controls {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    
    button {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      font-size: 11px;
    }
    
    .btn-generate {
      background: linear-gradient(135deg, #28a745 0%, #1e7e34 100%);
      color: white;
      text-transform: uppercase;
    }
    
    .btn-print {
      background: linear-gradient(135deg, #007bff 0%, #0056b3 100%);
      color: white;
      text-transform: uppercase;
    }
    
    .btn-back {
      background: linear-gradient(135deg, #17a2b8 0%, #117a8b 100%);
      color: white;
    }
    
    .qr-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-top: 12px;
      padding: 10px;
      background: white;
      border-radius: 6px;
    }
    
    .qr-card {
      background: white;
      border: 1px solid #ddd;
      padding: 4px;
      border-radius: 3px;
      text-align: center;
      page-break-inside: avoid;
    }
    
    .qr-card h3 {
      color: #1a472a;
      font-size: 6px;
      margin-bottom: 1px;
      font-weight: 700;
      text-transform: uppercase;
      word-break: break-word;
      line-height: 1;
      min-height: 10px;
      max-height: 10px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .qr-card .dni {
      color: #5a7a6d;
      font-size: 4px;
      margin-bottom: 1px;
      font-weight: 600;
    }
    
    .qr-image {
      width: 2.50cm;
      height: 2.50cm;
      margin: 0 auto;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 1px solid #eee;
    }
    
    .qr-image canvas {
      width: 100% !important;
      height: 100% !important;
      max-width: 2.50cm;
      max-height: 2.50cm;
    }
    
    .status {
      text-align: center;
      padding: 10px;
      background: linear-gradient(135deg, #d4edda 0%, #c3e6cb 100%);
      color: #155724;
      border-radius: 6px;
      margin-bottom: 12px;
      font-weight: 600;
      border-left: 4px solid #155724;
      font-size: 12px;
    }
    
    .footer {
      text-align: center;
      color: #a8d5ba;
      padding: 10px;
      margin-top: 20px;
      border-top: 1px solid rgba(212, 175, 55, 0.2);
      font-size: 10px;
    }
    
    @media print {
      body { background: white; padding: 0; }
      .header, .controls, .status, .footer { display: none; }
      .qr-grid { margin-top: 0; padding: 0; gap: 4px; }
      .container { max-width: 100%; }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>🎖️ BATLLOG 112 - Comunicaciones</h1>
    <p class="subtitle">Códigos QR - 12 Soldados</p>
  </div>

  <div class="status">✓ 12 QR de Comunicaciones - 4 por fila (2.50cm x 2.50cm)</div>

  <div class="controls">
    <button class="btn-generate" onclick="generarQR()">🎯 Generar QR</button>
    <button class="btn-print" onclick="window.print()">🖨️ Imprimir</button>
    <button class="btn-back" onclick="window.location.href='index.html'">🏠 Volver</button>
  </div>

  <div class="qr-grid" id="qrGrid"></div>

  <div class="footer">
    <p>BATLLOG 112 © 2026 | Perú | Solo Comunicaciones</p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
  const comunicaciones = [
    { apellido: "ACHATA CASTRO AARON", dni: "11226186" },
    { apellido: "CASTILLO CCANTO SMITH", dni: "7386143" },
    { apellido: "CHUQUILLAURI TOLEDO", dni: "73656600" },
    { apellido: "HUAMAN ROSALES JUSUE", dni: "7104571" },
    { apellido: "LAPA SAAVEDRA JEAN", dni: "7064184" },
    { apellido: "POMA ORE KEVIN", dni: "10380231" },
    { apellido: "REBATTA AVALOS HERLIN", dni: "6108051" },
    { apellido: "RETO NUÑES FABRICIO", dni: "6102156" },
    { apellido: "SANTIAGO OJEDA ELOY", dni: "7218249" },
    { apellido: "TAMAYO ROSALES JULIO", dni: "6191408" },
    { apellido: "TINA PACAYA JUAN", dni: "6936689" },
    { apellido: "VARGAS FLORES AXEL", dni: "1910086" }
  ];

  function generarQR() {
    const grid = document.getElementById('qrGrid');
    grid.innerHTML = '';
    
    const ordenado = [...comunicaciones].sort((a, b) => a.apellido.localeCompare(b.apellido));
    
    ordenado.forEach((s, index) => {
      const qrData = s.dni;
      
      const card = document.createElement('div');
      card.className = 'qr-card';
      card.innerHTML = `
        <h3>${s.apellido}</h3>
        <div class="dni">${s.dni}</div>
        <div id="qr-${index}" class="qr-image"></div>
      `;
      grid.appendChild(card);
      
      new QRCode(document.getElementById(`qr-${index}`), {
        text: qrData,
        width: 120,
        height: 120,
        colorDark: "#1a472a",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.L
      });
    });
  }

  // Generar automáticamente al cargar
  window.addEventListener('load', generarQR);
</script>

</body>
</html>
