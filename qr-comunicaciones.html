<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BATLLOG 112 - Comunicaciones QR</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; }
    body { 
      font-family: Arial, sans-serif; 
      background: #1a472a;
      padding: 8px;
      margin: 0;
    }
    .container { width: 100%; max-width: 210mm; margin: 0 auto; }
    .header {
      background: #1a472a;
      padding: 8px;
      text-align: center;
      margin-bottom: 8px;
      border-bottom: 2px solid #d4af37;
    }
    h1 { color: #d4af37; font-size: 16px; margin: 0; }
    .subtitle { color: #a8d5ba; font-size: 9px; margin: 0; }
    
    .controls {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }
    
    button {
      padding: 6px 12px;
      border: none;
      border-radius: 4px;
      font-weight: 600;
      cursor: pointer;
      font-size: 10px;
    }
    
    .btn-generate {
      background: #28a745;
      color: white;
    }
    
    .btn-print {
      background: #007bff;
      color: white;
    }
    
    .btn-back {
      background: #17a2b8;
      color: white;
    }
    
    .qr-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      padding: 6px;
      background: white;
      border-radius: 4px;
    }
    
    .qr-card {
      background: white;
      border: 1px solid #ccc;
      padding: 2px;
      border-radius: 2px;
      text-align: center;
      page-break-inside: avoid;
    }
    
    .qr-card h3 {
      color: #1a472a;
      font-size: 5px;
      margin: 0 0 1px 0;
      font-weight: 700;
      text-transform: uppercase;
      word-break: break-word;
      line-height: 1;
      height: 8px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .qr-card .dni {
      color: #5a7a6d;
      font-size: 3px;
      margin-bottom: 1px;
      font-weight: 600;
    }
    
    .qr-card .grado {
      color: #5a7a6d;
      font-size: 3px;
      font-weight: 600;
    }
    
    .qr-image {
      width: 2.50cm;
      height: 2.50cm;
      margin: 0 auto;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    
    .qr-image canvas {
      width: 100% !important;
      height: 100% !important;
      max-width: 2.50cm;
      max-height: 2.50cm;
    }
    
    .footer {
      text-align: center;
      color: #a8d5ba;
      padding: 6px;
      font-size: 8px;
      margin-top: 10px;
    }
    
    @media print {
      body { background: white; padding: 0; margin: 0; }
      .header { display: none; }
      .controls { display: none; }
      .footer { display: none; }
      .container { max-width: 210mm; }
      .qr-grid { 
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 2px;
        padding: 0;
        margin: 0;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>BATLLOG 112 - Comunicaciones</h1>
    <p class="subtitle">12 Códigos QR (2.50cm x 2.50cm)</p>
  </div>

  <div class="controls">
    <button class="btn-generate" onclick="generarQR()">Generar QR</button>
    <button class="btn-print" onclick="window.print()">Imprimir PDF</button>
    <button class="btn-back" onclick="window.location.href='index.html'">Volver</button>
  </div>

  <div class="qr-grid" id="qrGrid"></div>

  <div class="footer">BATLLOG 112 © 2026 | Perú</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
  const comunicaciones = [
    { num: "01", apellido: "POMA ORE KEVIN", grado: "SO 1 EP", dni: "10380231", armamento: "GALIL", numArm: "12528" },
    { num: "02", apellido: "RETO NUÑES FABRICIO", grado: "SGTO 2", dni: "6102156", armamento: "FAL", numArm: "021325" },
    { num: "03", apellido: "TAMAYO ROSALES JULIO", grado: "SGTO 2", dni: "6191408", armamento: "FAL", numArm: "021431" },
    { num: "04", apellido: "CHUQUILLAURI TOLEDO", grado: "SGTO 2", dni: "73656600", armamento: "FAL", numArm: "021676" },
    { num: "05", apellido: "HUAMAN ROSALES JUSUE", grado: "CABO", dni: "7104571", armamento: "FAL", numArm: "022187" },
    { num: "06", apellido: "SANTIAGO OJEDA ELOY", grado: "CABO", dni: "7218249", armamento: "FAL", numArm: "022421" },
    { num: "07", apellido: "TINA PACAYA JUAN", grado: "CABO", dni: "6936689", armamento: "FAL", numArm: "022554" },
    { num: "08", apellido: "ACHATA CASTRO AARON", grado: "CABO", dni: "11226186", armamento: "FAL", numArm: "022893" },
    { num: "09", apellido: "REBATTA AVALOS HERLIN", grado: "CABO", dni: "6108051", armamento: "FAL", numArm: "022897" },
    { num: "10", apellido: "CASTILLO CCANTO SMITH", grado: "CABO", dni: "7386143", armamento: "FAL", numArm: "023231" },
    { num: "11", apellido: "VARGAS FLORES AXEL", grado: "CABO", dni: "1910086", armamento: "FAL", numArm: "023334" },
    { num: "12", apellido: "LAPA SAAVEDRA JEAN", grado: "CABO", dni: "7064184", armamento: "FAL", numArm: "023406" }

      { num: "13", apellido: "PEBE ANACLETO MOISES ", grado: "TCO 2° EP", dni: "10382331", armamento: "UZI", numArm: "12526" },
    { num: "14", apellido: "LUSTRE RODRIGUEZ", grado: "SGTO 1°", dni: "74602356", armamento: "FAL", numArm: "021259" }
  ];

  function generarQR() {
    const grid = document.getElementById('qrGrid');
    grid.innerHTML = '';
    
    comunicaciones.forEach((s, index) => {
      const qrData = `${s.apellido}|${s.grado}|${s.dni}|${s.armamento}|${s.numArm}`;
      
      const card = document.createElement('div');
      card.className = 'qr-card';
      card.innerHTML = `
        <h3>${s.apellido}</h3>
        <div class="grado">${s.grado}</div>
        <div class="dni">${s.dni}</div>
        <div id="qr-${index}" class="qr-image"></div>
      `;
      grid.appendChild(card);
      
      new QRCode(document.getElementById(`qr-${index}`), {
        text: s.dni,
        width: 120,
        height: 120,
        colorDark: "#1a472a",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.L
      });
    });
  }

  window.addEventListener('load', generarQR);
</script>

</body>
</html>
