<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escáner QR Soldados</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; padding: 20px; }
    .container { max-width: 500px; margin: 0 auto; }
    h1 { font-size: 28px; margin-bottom: 10px; color: #333; }
    .subtitle { color: #666; margin-bottom: 30px; font-size: 14px; }
    .section { background: white; border: 1px solid #ddd; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
    .section-title { font-weight: 600; margin-bottom: 15px; font-size: 16px; color: #333; }
    input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; margin-bottom: 10px; }
    button { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; margin-bottom: 10px; }
    .btn-primary { background: #4CAF50; color: white; }
    .btn-primary:active { transform: scale(0.98); }
    .btn-secondary { background: #2196F3; color: white; }
    .btn-danger { background: #f44336; color: white; }
    video { width: 100%; border-radius: 8px; background: #000; margin: 15px 0; display: none; }
    .status { padding: 15px; border-radius: 8px; margin: 15px 0; font-size: 14px; text-align: center; }
    .status.ready { background: #d4edda; color: #155724; }
    .status.scanning { background: #cfe2ff; color: #084298; }
    .status.success { background: #d4edda; color: #155724; }
    .status.error { background: #f8d7da; color: #842029; }
    .result { background: #f9f9f9; border: 1px solid #ddd; border-radius: 8px; padding: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    .result-text { flex: 1; }
    .result-id { font-weight: 600; font-size: 14px; }
    .result-time { font-size: 12px; color: #666; margin-top: 4px; }
    .remove-btn { background: #f44336; color: white; border: none; padding: 6px 12px; font-size: 12px; border-radius: 4px; cursor: pointer; }
    .empty { text-align: center; color: #999; padding: 30px 0; font-size: 14px; }
    .results-list { max-height: 400px; overflow-y: auto; }
  </style>
</head>
<body>

<div class="container">
  <h1>📱 Escáner QR</h1>
  <p class="subtitle">Escanea el QR del soldado para registrar</p>
  
  <div class="section">
    <div class="section-title">URL de Google Sheets</div>
    <input type="text" id="urlInput" placeholder="Pega la URL del Apps Script">
    <button class="btn-primary" onclick="guardarUrl()">Guardar URL</button>
  </div>
  
  <div class="section">
    <div class="section-title">Estado</div>
    <div id="status" class="status ready">✓ Listo para escanear</div>
  </div>
  
  <div class="section">
    <div class="section-title">Cámara</div>
    <video id="video" playsinline autoplay muted></video>
    <div id="error" style="display: none; background: #f8d7da; color: #842029; padding: 12px; border-radius: 8px; margin-bottom: 10px; font-size: 13px;"></div>
    <button id="btnStart" class="btn-primary" onclick="iniciarCamara()">Iniciar cámara</button>
    <button id="btnStop" class="btn-danger" onclick="detenerCamara()" style="display: none;">Detener</button>
  </div>
  
  <div class="section">
    <div class="section-title">Escaneos: <span id="count">0</span></div>
    <div class="results-list" id="results">
      <div class="empty">Sin escaneos aún</div>
    </div>
    <button class="btn-secondary" onclick="limpiar()" style="margin-top: 15px;">Limpiar todo</button>
  </div>
</div>

<canvas id="canvas" style="display: none;"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script>
  let appUrl = localStorage.getItem('appUrl') || '';
  let video, stream, scanning = false, scans = [];
  let videoReady = false;
  
  if (appUrl) document.getElementById('urlInput').value = appUrl;
  
  function guardarUrl() {
    appUrl = document.getElementById('urlInput').value.trim();
    if (!appUrl) {
      alert('Ingresa la URL');
      return;
    }
    localStorage.setItem('appUrl', appUrl);
    actualizarStatus('✓ URL guardada', 'success');
  }
  
  async function iniciarCamara() {
    if (!appUrl) {
      alert('Primero guarda la URL');
      return;
    }
    
    try {
      document.getElementById('error').style.display = 'none';
      actualizarStatus('Esperando cámara...', 'scanning');
      
      stream = await navigator.mediaDevices.getUserMedia({ 
        video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } } 
      });
      
      video = document.getElementById('video');
      video.srcObject = stream;
      video.style.display = 'block';
      
      video.onloadedmetadata = function() {
        videoReady = true;
        video.play();
        scanning = true;
        actualizarStatus('Escaneando...', 'scanning');
        escanear();
      };
      
      setTimeout(() => {
        if (!videoReady) {
          throw new Error('Video no cargó en tiempo');
        }
      }, 5000);
      
      document.getElementById('btnStart').style.display = 'none';
      document.getElementById('btnStop').style.display = 'block';
      
    } catch(e) {
      document.getElementById('error').textContent = 'Error: ' + e.message;
      document.getElementById('error').style.display = 'block';
      actualizarStatus('Error de cámara', 'error');
      document.getElementById('btnStart').style.display = 'block';
      document.getElementById('btnStop').style.display = 'none';
    }
  }
  
  function detenerCamara() {
    scanning = false;
    videoReady = false;
    if (stream) stream.getTracks().forEach(t => t.stop());
    if (video) video.style.display = 'none';
    document.getElementById('btnStart').style.display = 'block';
    document.getElementById('btnStop').style.display = 'none';
    actualizarStatus('Detenido', 'ready');
  }
  
  function actualizarStatus(msg, tipo = 'ready') {
    document.getElementById('status').className = `status ${tipo}`;
    document.getElementById('status').textContent = msg;
  }
  
  function escanear() {
    if (!scanning || !videoReady) return;
    
    if (video.videoWidth <= 0 || video.videoHeight <= 0) {
      requestAnimationFrame(escanear);
      return;
    }
    
    try {
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0);
      
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const code = jsQR(imageData.data, canvas.width, canvas.height);
      
      if (code) procesarQR(code.data);
    } catch(e) {
      console.log('Error en escaneo:', e);
    }
    
    requestAnimationFrame(escanear);
  }
  
  async function procesarQR(data) {
    scanning = false;
    actualizarStatus('Enviando...', 'scanning');
    
    try {
      const response = await fetch(appUrl, {
        method: 'POST',
        body: JSON.stringify({ nombre: data, id: data, rango: 'Militar' })
      });
      
      if (response.ok) {
        scans.unshift({ id: data, time: new Date().toLocaleTimeString('es-ES') });
        mostrarScans();
        actualizarStatus('✓ Registrado en Google Sheets', 'success');
        
        setTimeout(() => {
          if (document.getElementById('btnStop').style.display !== 'none' && videoReady) {
            scanning = true;
            escanear();
          }
        }, 1500);
      } else {
        actualizarStatus('Error al enviar', 'error');
        setTimeout(() => {
          if (document.getElementById('btnStop').style.display !== 'none' && videoReady) {
            scanning = true;
            escanear();
          }
        }, 1000);
      }
    } catch(e) {
      actualizarStatus('Error: ' + e.message, 'error');
      setTimeout(() => {
        if (document.getElementById('btnStop').style.display !== 'none' && videoReady) {
          scanning = true;
          escanear();
        }
      }, 1000);
    }
  }
  
  function mostrarScans() {
    const el = document.getElementById('results');
    document.getElementById('count').textContent = scans.length;
    
    if (scans.length === 0) {
      el.innerHTML = '<div class="empty">Sin escaneos aún</div>';
      return;
    }
    
    el.innerHTML = scans.map((s, i) => `
      <div class="result">
        <div class="result-text">
          <div class="result-id">${s.id}</div>
          <div class="result-time">${s.time}</div>
        </div>
        <button class="remove-btn" onclick="eliminar(${i})">✕</button>
      </div>
    `).join('');
  }
  
  function eliminar(i) { scans.splice(i, 1); mostrarScans(); }
  function limpiar() { if (confirm('¿Limpiar todos los escaneos?')) { scans = []; mostrarScans(); } }
</script>

</body>
</html>
