<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BATLLOG 112 - Scanner QR</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: 'Segoe UI', 'Roboto', Arial, sans-serif; 
      background: linear-gradient(135deg, #1a472a 0%, #2d5f40 50%, #0d2818 100%);
      padding: 15px;
      min-height: 100vh;
    }
    .container { max-width: 700px; margin: 0 auto; }
    .header {
      background: linear-gradient(135deg, #2d5f40 0%, #1a472a 100%);
      padding: 20px;
      text-align: center;
      border-bottom: 4px solid #d4af37;
      margin-bottom: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    h1 { color: #d4af37; font-size: 28px; margin-bottom: 5px; }
    .subtitle { color: #a8d5ba; font-size: 13px; }
    
    .config-section {
      background: linear-gradient(135deg, #e8f3ee 0%, #dff0e8 100%);
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      border-left: 4px solid #2d5f40;
    }
    
    .form-group {
      margin-bottom: 10px;
    }
    
    .form-group label {
      display: block;
      color: #1a472a;
      font-weight: 600;
      margin-bottom: 5px;
      font-size: 12px;
    }
    
    .form-group input {
      width: 100%;
      padding: 10px;
      border: 1px solid #a8d5ba;
      border-radius: 6px;
      font-size: 13px;
    }
    
    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 15px;
      flex-wrap: wrap;
    }
    
    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      font-size: 13px;
    }
    
    .btn-primary {
      background: linear-gradient(135deg, #28a745 0%, #1e7e34 100%);
      color: white;
      text-transform: uppercase;
    }
    
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(40, 167, 69, 0.3);
    }
    
    .btn-primary:disabled {
      background: #ccc;
      cursor: not-allowed;
      opacity: 0.6;
    }
    
    .btn-secondary {
      background: linear-gradient(135deg, #6c757d 0%, #545b62 100%);
      color: white;
    }
    
    .status {
      text-align: center;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
      font-weight: 600;
      font-size: 13px;
    }
    
    .status.waiting {
      background: linear-gradient(135deg, #cfe2ff 0%, #b6d4fe 100%);
      color: #084298;
      border-left: 4px solid #084298;
    }
    
    .status.scanning {
      background: linear-gradient(135deg, #d1ecf1 0%, #b8daff 100%);
      color: #0c5460;
      border-left: 4px solid #0c5460;
    }
    
    .status.error {
      background: linear-gradient(135deg, #f8d7da 0%, #f5c6cb 100%);
      color: #721c24;
      border-left: 4px solid #721c24;
    }
    
    .status.success {
      background: linear-gradient(135deg, #d4edda 0%, #c3e6cb 100%);
      color: #155724;
      border-left: 4px solid #155724;
    }
    
    #reader {
      width: 100%;
      margin: 20px 0;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 8px 25px rgba(0,0,0,0.2);
    }
    
    #reader video {
      width: 100%;
    }
    
    .info-box {
      background: linear-gradient(135deg, #fff3cd 0%, #ffeaa7 100%);
      border: 2px solid #ffc107;
      border-radius: 8px;
      padding: 15px;
      margin: 15px 0;
      color: #856404;
      font-size: 13px;
      line-height: 1.6;
    }
    
    .registros {
      background: white;
      padding: 15px;
      border-radius: 8px;
      margin-top: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    
    .registros h3 {
      color: #1a472a;
      margin-bottom: 10px;
      font-size: 14px;
    }
    
    .registro-item {
      padding: 10px;
      background: #f9f9f9;
      border-left: 3px solid #2d5f40;
      margin-bottom: 8px;
      border-radius: 4px;
      font-size: 12px;
    }
    
    .registro-item strong {
      color: #1a472a;
    }
    
    .footer {
      text-align: center;
      color: #a8d5ba;
      padding: 15px;
      margin-top: 20px;
      font-size: 11px;
    }
    
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    
    .modal.active {
      display: flex;
    }
    
    .modal-content {
      background: white;
      padding: 40px;
      border-radius: 12px;
      text-align: center;
      max-width: 90%;
      box-shadow: 0 15px 50px rgba(0,0,0,0.4);
      border-top: 5px solid #2d5f40;
    }
    
    .modal-content .check-icon {
      font-size: 60px;
      margin-bottom: 20px;
    }
    
    .modal-content h2 {
      color: #1a472a;
      font-size: 24px;
      margin-bottom: 10px;
      text-transform: uppercase;
    }
    
    .modal-content p {
      color: #5a7a6d;
      margin-bottom: 15px;
    }
    
    .soldier-data {
      background: #f5f5f5;
      padding: 15px;
      border-radius: 8px;
      text-align: left;
      margin: 15px 0;
    }
    
    .soldier-data div {
      margin: 5px 0;
      font-size: 13px;
    }
    
    .modal-content button {
      padding: 11px 40px;
      background: linear-gradient(135deg, #2d5f40 0%, #1a472a 100%);
      color: #d4af37;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
      text-transform: uppercase;
      margin-top: 20px;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>🎖️ BATLLOG 112 - Scanner QR</h1>
    <p class="subtitle">Escanea y registra soldados</p>
  </div>

  <div class="config-section">
    <div class="form-group">
      <label>🔗 URL de Google Sheets (Apps Script)</label>
      <input type="text" id="urlInput" placeholder="https://script.google.com/macros/s/...">
    </div>
    <div class="button-group">
      <button class="btn-primary" onclick="guardarUrl()">💾 Guardar URL</button>
      <button class="btn-secondary" onclick="window.location.href='index.html'">🏠 Volver</button>
    </div>
  </div>

  <div id="status" class="status waiting">⏳ Esperando configuración...</div>

  <div id="reader" style="display: none;"></div>

  <div class="info-box" id="infoBox" style="display: none;">
    <strong>📱 Instrucciones:</strong>
    Apunta la cámara al código QR y espera a que se detecte automáticamente.
  </div>

  <div class="button-group" id="controlButtons" style="display: none; margin: 15px 0;">
    <button class="btn-primary" id="btnStart" onclick="iniciarScanner()">📹 Iniciar Scanner</button>
    <button class="btn-primary" id="btnStop" onclick="detenerScanner()" style="display: none; background: linear-gradient(135deg, #dc3545 0%, #c82333 100%);">⏹ Detener Scanner</button>
  </div>

  <div class="registros" id="registros" style="display: none;">
    <h3>📊 Registros escaneados</h3>
    <div id="registrosList"></div>
  </div>

  <div class="footer">
    <p>BATLLOG 112 © 2026 | Perú</p>
  </div>
</div>

<!-- Modal de Éxito -->
<div class="modal" id="modal">
  <div class="modal-content">
    <div class="check-icon">✅</div>
    <h2>ESCANEO EXITOSO</h2>
    <p>Soldado registrado correctamente</p>
    <div class="soldier-data" id="modalData"></div>
    <button onclick="cerrarModal()">Aceptar</button>
  </div>
</div>

<script src="https://unpkg.com/html5-qrcode"></script>
<script>
  let appUrl = localStorage.getItem('appUrl') || '';
  let grupo = new URLSearchParams(window.location.search).get('grupo') || '';
  let qrScanner = null;
  let registros = [];
  let scanning = false;
  let canScan = true;

  // Cargar configuración guardada
  if (appUrl) {
    document.getElementById('urlInput').value = appUrl;
    actualizarEstado();
  }

  // Mostrar grupo actual
  if (grupo) {
    const statusDiv = document.getElementById('status');
    statusDiv.innerHTML += `<br><small>Grupo: ${grupo}</small>`;
  }

  function guardarUrl() {
    appUrl = document.getElementById('urlInput').value.trim();
    if (!appUrl) {
      mostrarError('Ingresa la URL de Google Sheets');
      return;
    }
    localStorage.setItem('appUrl', appUrl);
    actualizarEstado();
  }

  function actualizarEstado() {
    const status = document.getElementById('status');
    const controlButtons = document.getElementById('controlButtons');
    const infoBox = document.getElementById('infoBox');

    if (appUrl) {
      status.className = 'status scanning';
      status.textContent = '✓ Configurado - Haz click en "Iniciar Scanner"';
      controlButtons.style.display = 'flex';
      infoBox.style.display = 'block';
    } else {
      status.className = 'status waiting';
      status.textContent = '⏳ Ingresa la URL y guarda';
      controlButtons.style.display = 'none';
      infoBox.style.display = 'none';
    }
  }

  function iniciarScanner() {
    if (!appUrl) {
      mostrarError('Primero configura la URL');
      return;
    }

    const status = document.getElementById('status');
    status.className = 'status scanning';
    status.textContent = '⏳ Iniciando cámara... por favor espera';

    qrScanner = new Html5Qrcode('reader');
    document.getElementById('reader').style.display = 'block';

    const config = { fps: 15, qrbox: { width: 300, height: 300 } };

    qrScanner.start(
      { facingMode: 'environment' },
      config,
      onScanSuccess,
      onScanFailure
    ).then(() => {
      status.className = 'status scanning';
      status.textContent = '📹 Escaneando... apunta al código QR';
      document.getElementById('btnStart').style.display = 'none';
      document.getElementById('btnStop').style.display = 'block';
      scanning = true;
      canScan = true;
    }).catch(err => {
      mostrarError('❌ No se pudo acceder a la cámara. Verifica los permisos.\n\nError: ' + err.message);
      document.getElementById('reader').style.display = 'none';
      document.getElementById('btnStart').style.display = 'block';
      document.getElementById('btnStop').style.display = 'none';
    });
  }

  function detenerScanner() {
    if (qrScanner) {
      qrScanner.stop().then(() => {
        document.getElementById('reader').style.display = 'none';
        document.getElementById('status').className = 'status waiting';
        document.getElementById('status').textContent = '⏹ Scanner detenido';
        document.getElementById('btnStart').style.display = 'block';
        document.getElementById('btnStop').style.display = 'none';
        scanning = false;
      });
    }
  }

  function onScanSuccess(decodedText) {
    if (!canScan || !scanning) return;
    canScan = false;
    procesarQR(decodedText);
  }

  function onScanFailure(error) {
    // Sin errores en silencio
  }

  async function procesarQR(qrData) {
    const status = document.getElementById('status');
    status.className = 'status scanning';
    status.textContent = '📤 Procesando QR...';

    try {
      const response = await fetch(appUrl, {
        method: 'POST',
        body: JSON.stringify({ qrData: qrData, grupo: grupo || 'Comunicaciones' })
      });

      if (response.ok) {
        const resultado = await response.json();
        
        if (resultado.success && resultado.datos) {
          const datos = resultado.datos;
          mostrarModalExito(datos);
          registros.push(datos);
          actualizarRegistros();
          
          setTimeout(() => {
            canScan = true;
            status.className = 'status scanning';
            status.textContent = '📹 Escaneando... apunta al siguiente QR';
          }, 2000);
        } else {
          mostrarError('❌ Soldado no encontrado en la base de datos');
          setTimeout(() => {
            canScan = true;
            document.getElementById('status').className = 'status scanning';
            document.getElementById('status').textContent = '📹 Escaneando...';
          }, 2000);
        }
      } else {
        mostrarError('❌ Error al enviar a Google Sheets');
        setTimeout(() => {
          canScan = true;
          document.getElementById('status').className = 'status scanning';
          document.getElementById('status').textContent = '📹 Escaneando...';
        }, 2000);
      }
    } catch (error) {
      mostrarError('❌ Error: ' + error.message);
      setTimeout(() => {
        canScan = true;
        document.getElementById('status').className = 'status scanning';
        document.getElementById('status').textContent = '📹 Escaneando...';
      }, 2000);
    }
  }

  function mostrarModalExito(soldado) {
    const modal = document.getElementById('modal');
    const data = document.getElementById('modalData');
    data.innerHTML = `
      <div><strong>Apellido:</strong> ${soldado.apellido}</div>
      <div><strong>Grado:</strong> ${soldado.grado}</div>
      <div><strong>DNI:</strong> ${soldado.dni}</div>
      <div><strong>Armamento:</strong> ${soldado.armamento}</div>
      <div><strong>N° Armamento:</strong> ${soldado.numArm}</div>
      <div><strong>Hora:</strong> ${new Date().toLocaleString('es-PE')}</div>
    `;
    modal.classList.add('active');
  }

  function cerrarModal() {
    document.getElementById('modal').classList.remove('active');
  }

  function actualizarRegistros() {
    const registrosDiv = document.getElementById('registros');
    const registrosList = document.getElementById('registrosList');

    registrosDiv.style.display = 'block';
    registrosList.innerHTML = registros.map((r, i) => `
      <div class="registro-item">
        <strong>#${i + 1}</strong> - ${r.apellido} (${r.dni}) - ${r.grado}
      </div>
    `).join('');
  }

  function mostrarError(mensaje) {
    const status = document.getElementById('status');
    status.className = 'status error';
    status.textContent = mensaje;
  }
</script>

</body>
</html>
