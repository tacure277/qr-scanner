<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BATLLOG 112 - Scanner QR</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: 'Segoe UI', Arial, sans-serif; 
      background: linear-gradient(135deg, #1a472a 0%, #2d5f40 50%, #0d2818 100%);
      padding: 15px;
      min-height: 100vh;
    }
    .container { max-width: 700px; margin: 0 auto; }
    .header {
      background: linear-gradient(135deg, #2d5f40 0%, #1a472a 100%);
      padding: 20px;
      text-align: center;
      border-radius: 8px;
      border-bottom: 3px solid #d4af37;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    h1 { color: #d4af37; font-size: 24px; margin-bottom: 5px; }
    .subtitle { color: #a8d5ba; font-size: 13px; }
    
    .config-section {
      background: linear-gradient(135deg, #e8f3ee 0%, #dff0e8 100%);
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      border-left: 4px solid #2d5f40;
    }
    
    .form-group {
      margin-bottom: 10px;
    }
    
    .form-group label {
      display: block;
      color: #1a472a;
      font-weight: 600;
      margin-bottom: 5px;
      font-size: 12px;
    }
    
    .form-group input {
      width: 100%;
      padding: 10px;
      border: 1px solid #a8d5ba;
      border-radius: 6px;
      font-size: 13px;
    }
    
    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 15px;
      flex-wrap: wrap;
    }
    
    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      font-size: 13px;
      min-width: 120px;
    }
    
    .btn-primary {
      background: linear-gradient(135deg, #28a745 0%, #1e7e34 100%);
      color: white;
      text-transform: uppercase;
    }
    
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(40, 167, 69, 0.3);
    }
    
    .btn-secondary {
      background: linear-gradient(135deg, #6c757d 0%, #545b62 100%);
      color: white;
    }
    
    .btn-stop {
      background: linear-gradient(135deg, #dc3545 0%, #c82333 100%);
      color: white;
      display: none;
    }
    
    .status {
      text-align: center;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
      font-weight: 600;
      font-size: 13px;
    }
    
    .status.waiting {
      background: linear-gradient(135deg, #cfe2ff 0%, #b6d4fe 100%);
      color: #084298;
      border-left: 4px solid #084298;
    }
    
    .status.scanning {
      background: linear-gradient(135deg, #d1ecf1 0%, #b8daff 100%);
      color: #0c5460;
      border-left: 4px solid #0c5460;
    }
    
    .status.error {
      background: linear-gradient(135deg, #f8d7da 0%, #f5c6cb 100%);
      color: #721c24;
      border-left: 4px solid #721c24;
    }
    
    #reader {
      width: 100%;
      margin: 20px 0;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 8px 25px rgba(0,0,0,0.2);
      display: none;
    }
    
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 15px;
    }
    
    .modal.active { display: flex; }
    
    .modal-content {
      background: white;
      padding: 50px;
      border-radius: 16px;
      text-align: center;
      max-width: 500px;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      border-top: 8px solid #28a745;
      animation: slideIn 0.4s ease-out;
    }
    
    @keyframes slideIn {
      from {
        transform: translateY(-50px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }
    
    .check-icon {
      font-size: 80px;
      margin-bottom: 20px;
      animation: pulse 0.6s ease-in-out;
    }
    
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
    
    .modal-content h2 {
      color: #28a745;
      font-size: 32px;
      margin-bottom: 15px;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 1px;
    }
    
    .modal-content p {
      color: #666;
      margin-bottom: 30px;
      font-size: 16px;
    }
    
    .soldier-data {
      background: linear-gradient(135deg, #f5f5f5 0%, #efefef 100%);
      padding: 25px;
      border-radius: 10px;
      text-align: left;
      margin: 25px 0;
      border-left: 5px solid #28a745;
    }
    
    .soldier-data div {
      margin: 12px 0;
      font-size: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid #ddd;
    }
    
    .soldier-data div:last-child {
      border-bottom: none;
    }
    
    .soldier-data strong {
      color: #1a472a;
      font-weight: 600;
    }
    
    .soldier-data span {
      color: #333;
      text-align: right;
    }
    
    .modal-content button {
      padding: 14px 50px;
      background: linear-gradient(135deg, #28a745 0%, #1e7e34 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 16px;
      margin-top: 25px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 15px rgba(40, 167, 69, 0.3);
      transition: all 0.3s;
    }
    
    .modal-content button:hover {
      background: linear-gradient(135deg, #1e7e34 0%, #15592b 100%);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(40, 167, 69, 0.4);
    }
    
    .footer {
      text-align: center;
      color: #a8d5ba;
      padding: 15px;
      margin-top: 20px;
      font-size: 11px;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>🎖️ BATLLOG 112 - Scanner QR</h1>
    <p class="subtitle">Escanea y registra soldados</p>
  </div>

  <div class="config-section">
    <div class="form-group">
      <label>🔗 URL de Google Apps Script</label>
      <input type="text" id="urlInput" placeholder="https://script.google.com/macros/s/...">
    </div>
    <div class="button-group">
      <button class="btn-primary" onclick="guardarUrl()">💾 Guardar URL</button>
      <button class="btn-secondary" onclick="window.location.href='index.html'">🏠 Volver</button>
    </div>
  </div>

  <div id="status" class="status waiting">⏳ Ingresa la URL y guarda</div>

  <div id="reader"></div>

  <div class="button-group" id="controlButtons" style="display: none; margin: 15px 0;">
    <button class="btn-primary" id="btnStart" onclick="iniciarScanner()">📹 Iniciar Scanner</button>
    <button class="btn-primary btn-stop" id="btnStop" onclick="detenerScanner()">⏹ Detener</button>
  </div>

  <div class="footer">
    <p>BATLLOG 112 © 2026 | Perú</p>
  </div>
</div>

<!-- MODAL EMERGENTE -->
<div class="modal" id="modal">
  <div class="modal-content">
    <div class="check-icon">✅</div>
    <h2>ESCANEO COMPLETADO</h2>
    <p>Soldado registrado exitosamente</p>
    <div class="soldier-data" id="modalData"></div>
    <button onclick="cerrarModal()">✓ Aceptar y Continuar</button>
  </div>
</div>

<script src="https://unpkg.com/html5-qrcode"></script>
<script>
  let appUrl = localStorage.getItem('appUrl') || '';
  let qrScanner = null;
  let scanning = false;
  let canScan = true;
  
  let grupo = new URLSearchParams(window.location.search).get('grupo') || 'Comunicaciones';

  if (appUrl) {
    document.getElementById('urlInput').value = appUrl;
    actualizarEstado();
  }

  function guardarUrl() {
    appUrl = document.getElementById('urlInput').value.trim();
    if (!appUrl) {
      mostrarError('❌ Ingresa la URL de Google Apps Script');
      return;
    }
    localStorage.setItem('appUrl', appUrl);
    actualizarEstado();
  }

  function actualizarEstado() {
    const status = document.getElementById('status');
    const controlButtons = document.getElementById('controlButtons');

    if (appUrl) {
      status.className = 'status scanning';
      status.textContent = `✓ Configurado - Grupo: ${grupo} - Haz click en "Iniciar Scanner"`;
      controlButtons.style.display = 'flex';
    } else {
      status.className = 'status waiting';
      status.textContent = '⏳ Ingresa la URL y guarda';
      controlButtons.style.display = 'none';
    }
  }

  function iniciarScanner() {
    if (!appUrl) {
      mostrarError('❌ Primero configura la URL');
      return;
    }

    const status = document.getElementById('status');
    status.className = 'status scanning';
    status.textContent = '⏳ Iniciando cámara... por favor espera';

    qrScanner = new Html5Qrcode('reader');
    document.getElementById('reader').style.display = 'block';

    const config = { fps: 15, qrbox: { width: 300, height: 300 } };

    qrScanner.start(
      { facingMode: 'environment' },
      config,
      onScanSuccess,
      onScanFailure
    ).then(() => {
      status.className = 'status scanning';
      status.textContent = `📹 Escaneando (${grupo})... apunta al código QR`;
      document.getElementById('btnStart').style.display = 'none';
      document.getElementById('btnStop').style.display = 'block';
      scanning = true;
      canScan = true;
    }).catch(err => {
      mostrarError('❌ No se pudo acceder a la cámara. ' + err.message);
      document.getElementById('reader').style.display = 'none';
      document.getElementById('btnStart').style.display = 'block';
      document.getElementById('btnStop').style.display = 'none';
    });
  }

  function detenerScanner() {
    if (qrScanner) {
      qrScanner.stop().then(() => {
        document.getElementById('reader').style.display = 'none';
        document.getElementById('status').className = 'status waiting';
        document.getElementById('status').textContent = '⏹ Scanner detenido';
        document.getElementById('btnStart').style.display = 'block';
        document.getElementById('btnStop').style.display = 'none';
        scanning = false;
      }).catch(err => {
        console.log('Error al detener:', err);
      });
    }
  }

  function onScanSuccess(decodedText) {
    if (!canScan || !scanning) return;
    canScan = false;
    procesarQR(decodedText.trim());
  }

  function onScanFailure(error) {
    // Sin errores continuos
  }

  async function procesarQR(qrData) {
    const status = document.getElementById('status');
    status.className = 'status scanning';
    status.textContent = '📤 Enviando a Google Sheets...';

    try {
      const response = await fetch(appUrl, {
        method: 'POST',
        body: JSON.stringify({ qrData: qrData, grupo: grupo })
      });

      const resultado = await response.json();

      if (resultado.success) {
        const datos = resultado.datos;
        mostrarModalExito(datos);

        setTimeout(() => {
          if (canScan === false && scanning) {
            canScan = true;
            status.className = 'status scanning';
            status.textContent = `📹 Escaneando... apunta al siguiente QR`;
          }
        }, 2500);
      } else {
        mostrarError('❌ ' + (resultado.error || 'Error al registrar'));
        setTimeout(() => {
          canScan = true;
          status.className = 'status scanning';
          status.textContent = `📹 Escaneando...`;
        }, 2000);
      }
    } catch (error) {
      mostrarError('❌ Error: ' + error.message);
      setTimeout(() => {
        canScan = true;
        document.getElementById('status').className = 'status scanning';
        document.getElementById('status').textContent = `📹 Escaneando...`;
      }, 2000);
    }
  }

  function mostrarModalExito(datos) {
    const modal = document.getElementById('modal');
    const dataDiv = document.getElementById('modalData');
    
    if (qrScanner && scanning) {
      qrScanner.pause().catch(e => {});
    }
    
    dataDiv.innerHTML = `
      <div><strong>Apellido:</strong> <span>${datos.apellido || 'N/A'}</span></div>
      <div><strong>Grado:</strong> <span>${datos.grado || 'N/A'}</span></div>
      <div><strong>DNI:</strong> <span>${datos.dni || 'N/A'}</span></div>
      <div><strong>Armamento:</strong> <span>${datos.armamento || 'N/A'}</span></div>
      <div><strong>N° Armamento:</strong> <span>${datos.numArm || 'N/A'}</span></div>
      <div><strong>Hora:</strong> <span>${new Date().toLocaleString('es-PE')}</span></div>
      <div><strong>Grupo:</strong> <span>${grupo}</span></div>
    `;
    
    modal.classList.add('active');
  }

  function cerrarModal() {
    const modal = document.getElementById('modal');
    modal.classList.remove('active');
    
    if (qrScanner && scanning) {
      qrScanner.resume().catch(e => {});
    }
  }

  function mostrarError(mensaje) {
    const status = document.getElementById('status');
    status.className = 'status error';
    status.textContent = mensaje;
  }
</script>

</body>
</html>
