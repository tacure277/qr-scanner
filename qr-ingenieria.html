<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BATLLOG 112 - Ingeniería</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #1a472a; padding: 20px; }
    .container { max-width: 1200px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; }
    .header { text-align: center; margin-bottom: 30px; border-bottom: 3px solid #d4af37; padding-bottom: 20px; }
    .header h1 { color: #d4af37; font-size: 28px; margin-bottom: 5px; }
    .header p { color: #666; margin: 5px 0; }
    .controls { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    .btn { padding: 10px 20px; font-size: 14px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; transition: all 0.3s; }
    .btn-primary { background: #d4af37; color: #1a472a; }
    .btn-primary:hover { background: #c9a027; }
    .btn-success { background: #28a745; color: white; }
    .btn-success:hover { background: #218838; }
    .btn-danger { background: #dc3545; color: white; }
    .btn-danger:hover { background: #c82333; }
    .btn-info { background: #17a2b8; color: white; }
    .btn-info:hover { background: #138496; }
    .info-status { padding: 10px; background: #e8f4f8; border: 2px solid #084298; border-radius: 5px; color: #084298; font-weight: bold; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 20px; }
    .card { background: #f9f9f9; border: 2px solid #ddd; border-radius: 8px; padding: 6px; text-align: center; }
    .card h3 { font-size: 12px; color: #333; margin: 3px 0; }
    .card p { font-size: 10px; color: #666; margin: 2px 0; }
    .qr-image { width: 100%; height: auto; }
    input { padding: 8px; font-size: 12px; border: 1px solid #ddd; border-radius: 5px; }
    @media print { body { padding: 0; } .controls { display: none; } .grid { grid-template-columns: repeat(5, 1fr); } }
    @media (max-width: 768px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>🎖️ BATLLOG 112 - Ingeniería</h1>
    <p>Generador de QR - Compañía Ingeniería</p>
  </div>

  <div class="controls">
    <button class="btn btn-primary" onclick="generarIngenieria()">🔲 GENERAR QR</button>
    <button class="btn btn-success" onclick="window.print()">🖨️ IMPRIMIR</button>
    <button class="btn btn-info" onclick="irScanner()">📱 IR A SCANNER</button>
    <button class="btn btn-danger" onclick="location.href='index.html'">🏠 VOLVER AL INICIO</button>
  </div>

  <div class="info-status">
    ✓ 18 soldados de Ingeniería precargados
  </div>

  <div id="qrGrid" class="grid"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<script>
  const ingenieria = [
    { apellido: "LUJAN CAPCHA DAVID", dni: "96114249", grado: "CAP INF", armamento: "GALIL", numArm: "N/A" },
    { apellido: "CASTILLA LACION LUIS AMERICO", dni: "96114239", grado: "TCO1 T/INF", armamento: "GALIL", numArm: "N/A" },
    { apellido: "LEON SANCHEZ JUAN CARLOS", dni: "74561860", grado: "SO3 T/ADM", armamento: "GALIL", numArm: "96114244" },
    { apellido: "LOPEZ HUAPAYA YETSABEL", dni: "96114257", grado: "SO3 T/ADM", armamento: "GALIL", numArm: "N/A" },
    { apellido: "PUENTE ESPIRITU SEBASTIAN JESUS", dni: "60972298", grado: "SGTO2 SAA", armamento: "FAL", numArm: "020163" },
    { apellido: "MIO SIGUEÑAS ENRIQUE IGNASIO", dni: "60795970", grado: "SGTO2 SAA", armamento: "FAL", numArm: "018181" },
    { apellido: "LIMA ROJAS CLAUDIO", dni: "60454451", grado: "SGTO2 SAA", armamento: "FAL", numArm: "036703" },
    { apellido: "GUTIERREZ DE LA CRUZ YUCIDER", dni: "60093756", grado: "SGTO2 SAA", armamento: "FAL", numArm: "019297" },
    { apellido: "VALLES BADURELES JEREMY DANIEL", dni: "76900657", grado: "SGTO2 SAA", armamento: "FAL", numArm: "017760" },
    { apellido: "PECHE MAYANGA JUAN JESUS", dni: "60834704", grado: "SGTO2 SAA", armamento: "FAL", numArm: "020472" },
    { apellido: "AYZANA APOLINARIO CESAR", dni: "60500863", grado: "CABO SAA", armamento: "FAL", numArm: "020029" },
    { apellido: "GONZALES BARBOZA JEISON", dni: "63304509", grado: "CABO SAA", armamento: "FAL", numArm: "019644" },
    { apellido: "VALDEZ IPARRAGUIRE GUILLERMO", dni: "70702706", grado: "SLDO SAA", armamento: "FAL", numArm: "020552" },
    { apellido: "DAZA ASIPALI NOHL", dni: "77461426", grado: "SLDO SAA", armamento: "FAL", numArm: "019856" },
    { apellido: "HUARAZ ORE YANCEY GIOVANNI", dni: "77653237", grado: "SLDO SAA", armamento: "FAL", numArm: "020150" },
    { apellido: "YACHACHIN CUBAS EDDIE", dni: "77118574", grado: "SLDO SAA", armamento: "FAL", numArm: "021125" },
    { apellido: "SOLIER CORDOVA JERCY", dni: "76287176", grado: "SLDO SAA", armamento: "FAL", numArm: "021019" },
    { apellido: "FLORES PACAYA SERGIO JESUS", dni: "61245568", grado: "SLDO SAA", armamento: "FAL", numArm: "020698" }
  ];

  function generarIngenieria() {
    const grid = document.getElementById('qrGrid');
    grid.innerHTML = '';
    
    ingenieria.forEach((s, index) => {
      const qrData = s.dni;
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <h3>${s.apellido}</h3>
        <p>${s.grado}</p>
        <p>DNI: ${s.dni}</p>
        <div id="qr-${index}" class="qr-image"></div>
      `;
      grid.appendChild(card);
      
      new QRCode(document.getElementById(`qr-${index}`), {
        text: qrData,
        width: 120,
        height: 120,
        colorDark: "#1a472a",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.L
      });
    });
  }

  function irScanner() {
    const urlAppsScript = prompt('Ingresa la URL del Apps Script:');
    if (urlAppsScript) {
      localStorage.setItem('appsScriptUrl', urlAppsScript);
      window.location.href = 'scanner-profesional.html?grupo=Ingeniería';
    }
  }

  window.onload = function() {
    generarIngenieria();
  };
</script>

</body>
</html>
